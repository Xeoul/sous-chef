<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1F6F54"><meta name="apple-mobile-web-app-title" content="Sous Chef"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sous Chef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #F6F6F3;
    --card: #FFFFFF;
    --raised: #FFFFFF;
    --sunken: #ECECE7;
    --ink: #16191B;
    --ink-muted: rgba(22, 25, 27, 0.62);
    --ink-faint: rgba(22, 25, 27, 0.38);
    --line: rgba(22, 25, 27, 0.09);
    --line-strong: rgba(22, 25, 27, 0.17);
    --accent: #1F6F54;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(31, 111, 84, 0.10);
    --accent-text: #1B5A46;
    --danger: #B3261E;
    --danger-ink: #FFFFFF;
    --danger-soft: rgba(179, 38, 30, 0.08);
    --overlay: rgba(14, 16, 18, 0.45);
    --shadow-seg: 0 1px 2px rgba(22, 25, 27, 0.10), 0 0 0 1px rgba(22, 25, 27, 0.05);
    --shadow-pop: 0 24px 60px -20px rgba(14, 16, 18, 0.40);
    --radius: 14px;
    --wash: rgba(31, 111, 84, 0.05);
    --toast-bg: #16191B;
    --toast-ink: #F6F6F3;
    --toast-action: #8FD3B8;
    --star: #D99A1E;
    --star-soft: rgba(217, 154, 30, 0.12);
    --tile-s: 52%;
    --tile-bg-l: 90%;
    --tile-fg-l: 30%;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --ease-soft: cubic-bezier(.33, 1, .68, 1);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --star: #F2B84B;
      --star-soft: rgba(242, 184, 75, 0.14);
      --toast-bg: #EEF1EF;
      --toast-ink: #16191B;
      --toast-action: #1B5A46;
      --wash: rgba(120, 170, 150, 0.05);
      --tile-s: 28%;
      --tile-bg-l: 24%;
      --tile-fg-l: 80%;
      --paper: #0F1113;
      --card: #17191C;
      --raised: #2A2E33;
      --sunken: #1F2226;
      --ink: #EEF1EF;
      --ink-muted: rgba(238, 241, 239, 0.64);
      --ink-faint: rgba(238, 241, 239, 0.38);
      --line: rgba(238, 241, 239, 0.09);
      --line-strong: rgba(238, 241, 239, 0.17);
      --accent: #2F7A60;
      --accent-ink: #F3F7F5;
      --accent-soft: rgba(126, 178, 156, 0.12);
      --accent-text: #A3CDBB;
      --danger: #F2887F;
      --danger-ink: #2A0A08;
      --danger-soft: rgba(242, 136, 127, 0.12);
      --overlay: rgba(0, 0, 0, 0.6);
      --shadow-seg: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-pop: 0 24px 60px -20px rgba(0, 0, 0, 0.75);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --star: #F2B84B;
    --star-soft: rgba(242, 184, 75, 0.14);
    --toast-bg: #EEF1EF;
    --toast-ink: #16191B;
    --toast-action: #1B5A46;
    --wash: rgba(120, 170, 150, 0.05);
    --tile-s: 28%;
    --tile-bg-l: 24%;
    --tile-fg-l: 80%;
    --paper: #0F1113;
    --card: #17191C;
    --raised: #2A2E33;
    --sunken: #1F2226;
    --ink: #EEF1EF;
    --ink-muted: rgba(238, 241, 239, 0.64);
    --ink-faint: rgba(238, 241, 239, 0.38);
    --line: rgba(238, 241, 239, 0.09);
    --line-strong: rgba(238, 241, 239, 0.17);
    --accent: #2F7A60;
    --accent-ink: #F3F7F5;
    --accent-soft: rgba(126, 178, 156, 0.12);
    --accent-text: #A3CDBB;
    --danger: #F2887F;
    --danger-ink: #2A0A08;
    --danger-soft: rgba(242, 136, 127, 0.12);
    --overlay: rgba(0, 0, 0, 0.6);
    --shadow-seg: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-pop: 0 24px 60px -20px rgba(0, 0, 0, 0.75);
  }

  * { box-sizing: border-box; }
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [hidden] { display: none !important; }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes backdropIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.97) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes sheetUp {
    from { transform: translateY(32px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes checkPop {
    0% { transform: scale(0.82); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  @keyframes shine {
    from { background-position: -60% 0; }
    to { background-position: 160% 0; }
  }
  @keyframes cheer {
    0% { transform: translateY(0); }
    35% { transform: translateY(-3px); }
    100% { transform: translateY(0); }
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(10px); }
  }
  @keyframes ring {
    0%, 100% { transform: rotate(0); }
    15% { transform: rotate(-5deg); }
    30% { transform: rotate(5deg); }
    45% { transform: rotate(-3deg); }
    60% { transform: rotate(3deg); }
    75% { transform: rotate(0); }
  }
  @keyframes alarmGlow {
    0%, 100% { box-shadow: var(--shadow-pop), 0 0 0 0 color-mix(in srgb, var(--danger) 45%, transparent); }
    50% { box-shadow: var(--shadow-pop), 0 0 0 8px color-mix(in srgb, var(--danger) 0%, transparent); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }

  body {
    margin: 0;
    background: radial-gradient(110% 340px at 50% -80px, var(--wash), transparent 75%) no-repeat, var(--paper);
    color: var(--ink);
    font: 15px/1.45 'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  .app {
    max-width: 640px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 18px calc(56px + var(--tray-h, 0px));
  }
  @media (min-width: 700px) {
    .app { padding-block: 36px calc(72px + var(--tray-h, 0px)); }
  }

  /* ---------- Header + tabs ---------- */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    flex: none;
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: none;
  }
  .brand-mark svg { width: 20px; height: 20px; }
  .brand h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.55rem;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--ink-faint);
    min-width: 0;
  }
  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .status.is-local .dot { background: var(--ink-faint); }

  .tabbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    padding-block: 12px;
    margin-bottom: 8px;
  }
  .tabs {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 4px;
    background: var(--sunken);
    border-radius: 12px;
  }
  /* One highlight that glides to whichever tab is active. */
  .tabs::before {
    content: '';
    position: absolute;
    z-index: 0;
    top: 4px;
    bottom: 4px;
    left: 4px;
    width: calc((100% - 16px) / 3);
    border-radius: 9px;
    background: var(--raised);
    box-shadow: var(--shadow-seg);
    transition: transform 460ms var(--ease);
  }
  .tabs:has(.tab-btn:nth-child(2).active)::before { transform: translateX(calc(100% + 4px)); }
  .tabs:has(.tab-btn:nth-child(3).active)::before { transform: translateX(calc(200% + 8px)); }
  .tab-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 8px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--ink-muted);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    z-index: 1;
  }
  .tab-btn:hover:not(.active) { color: var(--ink); }
  .tab-btn.active { color: var(--ink); }
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tab-count {
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-text);
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .tab-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 0;
  }
  /* Entrance animations are gated behind .entering (added by JS only for genuinely new
     content, removed after playing) rather than declared unconditionally on the base
     selector. [hidden]/display:none removes an element from the render tree entirely, and
     per spec that resets any already-finished animation on it and its descendants — so an
     unconditional "animation:" here would replay every time a tab (or any [hidden]-toggled
     container) was simply switched away from and back to, with nothing having changed. */
  .tab-panel.entering { animation: fadeSlideUp 480ms var(--ease) both; }

  .panel-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 40px;
  }
  .summary {
    margin: 0;
    font-size: 0.9rem;
    color: var(--ink-muted);
  }
  .summary strong { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

  /* One quiet surface per list — rows are separated by hairlines, not nested cards. */
  .surface {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
  }

  /* ---------- Buttons ---------- */

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 40px;
    padding: 0 16px;
    border: 1px solid transparent;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn:not(:disabled):active { transform: scale(0.97); }
  .btn-accent { background: var(--accent); color: var(--accent-ink); }
  .btn-accent:not(:disabled):hover { filter: brightness(1.06); }
  .btn-outline { background: var(--card); color: var(--ink); border-color: var(--line-strong); }
  .btn-outline:hover { background: var(--sunken); }
  .btn-ghost { background: transparent; color: var(--ink-muted); border-color: var(--line-strong); align-self: center; }
  .btn-ghost:hover { color: var(--ink); background: var(--sunken); }
  .btn-danger { background: var(--danger); color: var(--danger-ink); }
  .btn-text {
    background: none;
    border: none;
    padding: 8px 0;
    color: var(--accent-text);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-text:hover { text-decoration: underline; text-underline-offset: 3px; }
  .btn-text:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .btn-danger-text { color: var(--danger); padding-inline: 4px; }
  .btn.is-loading::before {
    content: '';
    width: 13px;
    height: 13px;
    flex: none;
    border-radius: 50%;
    border: 2px solid color-mix(in srgb, currentColor 30%, transparent);
    border-top-color: currentColor;
    animation: spin 650ms linear infinite;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    flex: none;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--sunken); color: var(--ink); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-btn svg { width: 18px; height: 18px; }

  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
    flex: none;
  }
  input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Gated behind a JS-added class (set only on a deliberate check, removed after playing)
     rather than the stateless :checked selector — otherwise this would replay every time
     the row became visible again after its container was hidden (e.g. a tab switch),
     since [hidden] resets any already-finished animation on its descendants. */
  .shop-item input[type="checkbox"].just-checked { animation: checkPop 360ms var(--ease-soft); }

  /* ---------- Recipes ---------- */

  .recipe-list { list-style: none; margin: 0; padding: 0; overflow: hidden; }
  .recipe-card {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    column-gap: 8px;
    row-gap: 10px;
    padding: 12px 10px 12px 12px;
    border-top: 1px solid var(--line);
    transition: background-color 320ms var(--ease);
  }
  .recipe-card:has(input[data-recipe]:checked) { background: var(--accent-soft); }
  .recipe-card:first-child { border-top: none; }
  .recipe-card.entering { animation: fadeSlideUp 460ms var(--ease) both; }
  .recipe-select {
    display: grid;
    grid-template-columns: 46px 1fr;
    column-gap: 14px;
    align-items: center;
    min-width: 0;
    cursor: pointer;
  }

  /* Recipe tile: a colour + initial that identifies the dish on every tab. On the Recipes tab
     it is also the plan toggle — the real checkbox sits invisibly on top of it. */
  .tile {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    flex: none;
    background: hsl(var(--hue, 152) var(--tile-s) var(--tile-bg-l));
    color: hsl(var(--hue, 152) 45% var(--tile-fg-l));
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.25rem;
    transition: background-color 300ms var(--ease), transform 300ms var(--ease), box-shadow 300ms var(--ease);
  }
  .tile > * { grid-area: 1 / 1; }
  .tile-letter { transition: opacity 200ms ease, transform 300ms var(--ease); }
  .tile-check { width: 24px; height: 24px; stroke: var(--accent-ink); stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 380ms var(--ease) 80ms; }
  .tile-sm { width: 38px; height: 38px; border-radius: 11px; font-size: 1.05rem; }
  .plan-toggle { position: relative; width: 46px; height: 46px; }
  .plan-toggle input[type="checkbox"] {
    position: absolute;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
  }
  .plan-toggle input:checked + .tile { background: var(--accent); }
  .plan-toggle input:checked + .tile .tile-letter { opacity: 0; transform: scale(0.5); }
  .plan-toggle input:checked + .tile .tile-check { stroke-dashoffset: 0; }
  .plan-toggle input:focus-visible + .tile { outline: 2px solid var(--accent); outline-offset: 2px; }
  .recipe-select:hover .tile { transform: scale(1.05); }
  .plan-toggle input.just-checked + .tile { animation: checkPop 360ms var(--ease-soft); }
  .recipe-info { min-width: 0; }
  .recipe-name {
    display: block;
    font-weight: 600;
    font-size: 1rem;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .recipe-meta {
    display: block;
    margin-top: 2px;
    font-size: 0.84rem;
    color: var(--ink-muted);
  }
  .recipe-actions { display: flex; }
  .week-servings {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: 60px;
    font-size: 0.84rem;
    color: var(--ink-muted);
  }
  .stepper-group {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--card);
  }
  .stepper {
    width: 32px;
    height: 30px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-size: 1.05rem;
    line-height: 1;
    cursor: pointer;
  }
  .stepper:first-child { border-radius: 999px 0 0 999px; }
  .stepper:last-child { border-radius: 0 999px 999px 0; }
  .stepper:hover { background: var(--sunken); }
  .stepper:active { transform: scale(0.9); }
  .stepper:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .servings-value {
    min-width: 1.8em;
    text-align: center;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Shopping list ---------- */

  .shop-summary { display: flex; flex-direction: column; gap: 8px; }
  .shop-summary p { margin: 0; font-size: 0.9rem; color: var(--ink-muted); }
  .shop-summary strong { color: var(--ink); font-variant-numeric: tabular-nums; }
  .progress {
    height: 6px;
    border-radius: 999px;
    background: var(--sunken);
    overflow: hidden;
  }
  .bump { display: inline-block; animation: bump 340ms var(--ease-soft); }
  .celebrate .progress span {
    background-image: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, 0.65) 50%, transparent 70%);
    background-size: 60% 100%;
    background-repeat: no-repeat;
    animation: shine 900ms ease-out;
  }
  .celebrate p { animation: cheer 500ms var(--ease-soft); }
  .shop-summary.is-complete p { color: var(--accent-text); }
  .progress span {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: var(--accent);
    transition: width 420ms var(--ease);
  }

  .shopping-toolbar {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .unit-toggle {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    padding: 3px;
    background: var(--sunken);
    border-radius: 10px;
    isolation: isolate;
  }
  .unit-toggle::before {
    content: '';
    position: absolute;
    top: 3px;
    bottom: 3px;
    left: 3px;
    width: calc(50% - 3px);
    border-radius: 8px;
    background: var(--raised);
    box-shadow: var(--shadow-seg);
    z-index: 0;
    transition: transform 440ms var(--ease);
  }
  .unit-toggle:has(.unit-btn:nth-child(2).active)::before { transform: translateX(100%); }
  .unit-btn {
    position: relative;
    z-index: 1;
    height: 32px;
    padding: 0 11px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--ink-muted);
    font-weight: 600;
    font-size: 0.82rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .unit-btn.active { color: var(--ink); }
  .unit-btn:hover:not(.active) { color: var(--ink); }
  .unit-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shop-surface { padding: 2px 16px; }
  .recipe-shop-group { padding: 14px 0 6px; border-top: 1px solid var(--line); }
  .recipe-shop-group:first-child { border-top: none; }
  .recipe-shop-group.entering { animation: fadeSlideUp 460ms var(--ease) both; }
  .recipe-shop-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;

  .shop-item input[type="checkbox"] {
    -webkit-appearance: none;

  .shop-item input[type="checkbox"]::after {

  }
  .shop-item input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }

  .shop-item label:hover input[type="checkbox"]:not(:checked) { border-color: var(--accent); }
  .shop-item label { grid-template-columns: 22px 88px 1fr; }
  .shop-name {
    justify-self: start;
    font-size: 0.96rem;
    overflow-wrap: anywhere;
  }
  /* The strike is drawn on an inline span, not the block: an inline element's background runs
     through each wrapped line in turn, so a long name gets struck on every line, and the sweep
     travels across line one and on into line two in reading order. */
  .shop-name-text {

  /* ---------- Photos ---------- */
  .tile { position: relative; overflow: hidden; }

  .tile.has-photo { background: var(--sunken); }

  .cook-hero { display: block; width: 100%; aspect-ratio: 16 / 9; max-height: 240px; object-fit: cover; border-radius: 12px; margin-bottom: 16px; background: var(--sunken); }
  .cook-hero.entering { animation: fadeSlideUp 460ms var(--ease) both; }
  /* With a big photo up top, the small tile beside the name would just repeat it. */
  .cook-recipe-group.has-hero .cook-head .tile { display: none; }

  /* ---------- Nutrition & cost ---------- */

  .cost-lines li:first-child { border-top: none; }

  .share-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
  .share-actions .btn { width: 100%; }

  .box-tools { display: flex; justify-content: center; margin-top: -2px; }

  #printCard { display: none; }

    #printCard h1 { font-size: 22pt; margin: 0 0 4pt; }

  /* ---------- Cook ---------- */

  .recipe-pill.active { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--ink); }

  .cook-surface { padding: 0 18px; }

  /* ---------- Empty states ---------- */

  .empty-state, .empty-note {

  #recipeEmptyNote { border: 1px dashed var(--line-strong); border-radius: var(--radius); }

  /* ---------- Dialog ---------- */

  .modal-backdrop {
    position: fixed;

    z-index: 100;
    display: flex;
    align-items: center;

  .modal {

    animation: modalPop 440ms var(--ease) both;
  }
  @media (max-width: 600px) {

    }
  }
  .modal-head {

  .modal-choice { display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
  .choice-card {

  .modal-choice .choice-card:nth-child(2) { animation-delay: 90ms; }
  .choice-card:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }

  .choice-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .choice-title { font-weight: 600; font-size: 1rem; color: var(--ink); }

  /* Inputs are 16px so phones don't zoom the page when one is focused. */
  .field input[type="text"],

  ::placeholder { color: var(--ink-faint); opacity: 1; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .recipe-form-fields { display: flex; flex-direction: column; gap: 18px; }
  .field label, .recipe-form-fields .ingredients-label {

  /* The action row sticks to the bottom of the scrolling sheet, so Save is always in reach. */
  .form-actions {

  .save-zone { display: flex; gap: 8px; }

  .search-row { display: flex; gap: 8px; margin-bottom: 4px; }

  }
  .search-result:hover { border-color: var(--accent); background: var(--accent-soft); }
  .search-result:active { transform: scale(0.99); }
  .search-result:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .search-results > .search-result:nth-child(2) { animation-delay: 55ms; }

  .search-results > .search-result:nth-child(4) { animation-delay: 165ms; }

  .search-result-title { font-weight: 600; font-size: 0.96rem; color: var(--ink); }
  .search-result-domain { font-size: 0.76rem; font-weight: 600; color: var(--accent-text); }
  .search-result-snippet {

  .paste-tip { margin: 10px 0; font-size: 0.84rem; line-height: 1.5; color: var(--ink-muted); }
  .paste-tip a { color: var(--accent-text); }

  @media (prefers-reduced-motion: no-preference) {
    .icon-btn, .stepper, .btn, .btn-text, .tab-btn, .unit-btn, .recipe-pill, .choice-card, .search-result, .remove-ing {
      transition: background-color 200ms var(--ease), border-color 200ms var(--ease), color 200ms var(--ease), box-shadow 200ms var(--ease), transform 200ms var(--ease);
    }
  }
  /* ---------- Shopping: own items, sections, pantry, sharing ---------- */

  .bar-left { display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-width: 0; }
  .btn-small { font-size: 0.84rem; padding: 2px 0; }
  .add-item { display: flex; gap: 8px; }

  .shop-summary-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* A row is the tappable label plus one quiet trailing action (pantry / remove). */
  .shop-item { display: flex; align-items: flex-start; gap: 2px; border-top: 1px solid var(--line); }
  .shop-item:first-child { border-top: none; }
  .shop-item label { flex: 1; min-width: 0; border-top: none; }
  .shop-item.is-extra label { grid-template-columns: 22px 1fr; }
  .row-action {
    width: 34px;
    height: 34px;
    margin-top: 6px;
    flex: none;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    transition: background-color 200ms var(--ease), color 200ms var(--ease), opacity 200ms ease;
  }
  .row-action svg { width: 17px; height: 17px; }
  .row-action:hover { background: var(--sunken); color: var(--ink); }
  .row-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .shop-item.is-checked .row-action { opacity: 0.45; }

  .section-icon {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    flex: none;
    background: var(--sunken);
    color: var(--ink-muted);
  }
  .section-icon svg { width: 15px; height: 15px; }
  .section-name { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.05rem; }
  .section-meta { font-size: 0.8rem; color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .shop-section.is-done .section-meta { color: var(--accent-text); font-weight: 600; }

  .pantry-section { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 0 14px; }
  .pantry-section summary {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 50px;
    list-style: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--ink-muted);
  }
  .pantry-section summary::-webkit-details-marker { display: none; }
  .pantry-section summary::after {
    content: '';
    width: 7px;
    height: 7px;
    margin: 0 4px 3px auto;
    border-right: 2px solid currentColor;
    border-bottom: 2px solid currentColor;
    transform: rotate(45deg);
    transition: transform 300ms var(--ease);
  }
  .pantry-section[open] summary::after { transform: translateY(3px) rotate(-135deg); }
  .pantry-section summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .pantry-list { list-style: none; margin: 0 0 8px; padding: 0; }
  .pantry-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0;
    border-top: 1px solid var(--line);
    font-size: 0.94rem;
    color: var(--ink-muted);
  }

  .toast-host {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px) + var(--tray-h, 0px));
    z-index: 150;
    display: flex;
    justify-content: center;
    padding-inline: 16px;
    pointer-events: none;
    transition: bottom 300ms var(--ease);
  }
  .toast {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 440px;
    min-height: 46px;
    padding: 6px 6px 6px 16px;
    border-radius: 12px;
    background: var(--toast-bg);
    color: var(--toast-ink);
    font-size: 0.9rem;
    font-weight: 500;
    box-shadow: var(--shadow-pop);
    animation: toastIn 360ms var(--ease) both;
  }
  .toast.leaving { animation: toastOut 220ms ease both; }
  .toast-msg { padding-block: 6px; }
  .toast-undo {
    border: none;
    border-radius: 8px;
    padding: 8px 12px;
    background: transparent;
    color: var(--toast-action);
    font-weight: 700;
    cursor: pointer;
  }
  .toast-undo:hover { background: color-mix(in srgb, var(--toast-action) 16%, transparent); }
  .toast-undo:focus-visible { outline: 2px solid var(--toast-action); outline-offset: 1px; }

  .share-text { min-height: 220px; font-size: 15px; }
  /* ---------- Cook mode: steps, timers, screen ---------- */

  .wake-note { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 0.84rem; font-weight: 600; color: var(--accent-text); }
  .cook-head-text { min-width: 0; }
  .cook-sub { margin: 2px 0 0; display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 0.82rem; color: var(--ink-muted); }
  .cook-sub:empty { display: none; }
  .source-link { color: var(--accent-text); font-weight: 600; text-decoration: none; }
  .source-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .steps-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .steps-head .btn-text { padding: 0; font-size: 0.82rem; }

  .cook-steps li::before { content: none; }
  .cook-steps { gap: 4px; margin-top: 6px; }
  .cook-steps li {
    grid-template-columns: 30px 1fr;
    align-items: start;
    column-gap: 10px;
    margin-inline: -8px;
    padding: 8px;
    border-radius: 12px;
    cursor: pointer;
    transition: background-color 220ms var(--ease);
  }
  .cook-steps li:hover { background: color-mix(in srgb, var(--sunken) 70%, transparent); }
  .step-num {
    width: 28px;
    height: 28px;
    margin-top: 1px;
    border: none;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    color: var(--accent-text);
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background-color 260ms var(--ease), transform 200ms var(--ease);
  }
  .step-num > * { grid-area: 1 / 1; }
  .step-num:active { transform: scale(0.9); }
  .step-num:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .step-n { transition: opacity 180ms ease, transform 260ms var(--ease); }
  .step-check { width: 16px; height: 16px; stroke: var(--accent-ink); stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 360ms var(--ease) 60ms; }
  .step-text { transition: color 260ms ease; }
  .cook-step.is-done .step-num { background: var(--accent); }
  .cook-step.is-done .step-n { opacity: 0; transform: scale(0.5); }
  .cook-step.is-done .step-check { stroke-dashoffset: 0; }
  .cook-step.is-done .step-text { color: var(--ink-faint); }

  .timer-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin: 0 1px;
    padding: 0 9px 0 7px;
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent-text);
    font: inherit;
    font-weight: 600;
    font-size: 0.92em;
    line-height: 1.6;
    vertical-align: baseline;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 220ms var(--ease), color 220ms var(--ease), border-color 220ms var(--ease);
  }
  .timer-chip svg { width: 13px; height: 13px; flex: none; }
  .timer-chip:hover { border-color: var(--accent); }
  .timer-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .timer-chip.is-running, .timer-chip.is-paused { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
  .timer-chip.is-paused { opacity: 0.75; }
  .timer-chip.is-done { background: var(--danger); border-color: var(--danger); color: var(--danger-ink); animation: ring 1.1s ease-in-out infinite; }

  .timer-tray {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 90; /* under an open dialog, so it never covers the form’s buttons */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    pointer-events: none;
  }
  .timer-card {
    position: relative;
    overflow: hidden;
    pointer-events: auto;
    width: 100%;
    max-width: 608px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px 10px 13px 16px;
    border-radius: 14px;
    background: var(--toast-bg);
    color: var(--toast-ink);
    box-shadow: var(--shadow-pop);
  }
  .timer-card.entering { animation: toastIn 360ms var(--ease) both; }
  .timer-card.is-done { background: var(--danger); color: var(--danger-ink); animation: alarmGlow 1.2s ease-in-out infinite; }
  .timer-info { display: flex; flex-direction: column; min-width: 0; }
  .timer-label { font-size: 0.8rem; opacity: 0.78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .timer-time { font-size: 1.45rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .timer-actions { display: flex; gap: 6px; }
  .timer-btn {
    min-width: 40px;
    height: 40px;
    padding: 0 10px;
    border: none;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, currentColor 14%, transparent);
    color: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    cursor: pointer;
  }
  .timer-btn:hover { background: color-mix(in srgb, currentColor 22%, transparent); }
  .timer-btn:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
  .timer-btn svg { width: 18px; height: 18px; }
  .timer-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: color-mix(in srgb, currentColor 14%, transparent); }
  .timer-bar span { display: block; height: 100%; background: var(--toast-action); transform-origin: left; transition: transform 300ms linear; }
  .timer-card.is-done .timer-bar { display: none; }
  /* ---------- Recipe box: search, favorites, notes ---------- */

  .recipe-tools { display: flex; gap: 8px; }
  .search-field {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink-faint);
    cursor: text;
    transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
  }
  .search-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-field svg { width: 18px; height: 18px; flex: none; }
  .search-field input { flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent; color: var(--ink); font-size: 16px; }
  .fav-filter {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 44px;
    padding: 0 14px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink-muted);
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: background-color 200ms var(--ease), border-color 200ms var(--ease), color 200ms var(--ease);
  }
  .fav-filter svg { width: 16px; height: 16px; }
  .fav-filter[aria-pressed="true"] { background: var(--star-soft); border-color: var(--star); color: var(--ink); }
  .fav-filter[aria-pressed="true"] svg { fill: var(--star); stroke: var(--star); }
  .fav-filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .fav-btn svg { transition: fill 200ms ease, stroke 200ms ease; }
  .fav-btn.is-fav { color: var(--star); }
  .fav-btn.is-fav svg { fill: var(--star); }
  .recipe-actions { gap: 2px; }

  .optional { margin-left: 4px; font-weight: 500; color: var(--ink-faint); }
  .notes-area { min-height: 88px; }
  .form-actions.confirming [data-action="duplicate"], .form-actions.confirming [data-action="share-recipe"] { display: none; }
  .cook-notes-wrap { margin-top: 20px; }
  .cook-notes { margin: 6px 0 0; white-space: pre-wrap; line-height: 1.6; font-size: 0.96rem; }

  /* ---------- Recipe details: tags, time, rating ---------- */

  .recipe-extra { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 6px; font-size: 0.78rem; color: var(--ink-muted); }
  .recipe-extra:empty { display: none; }
  .tag-chip {
    display: inline-flex;
    align-items: center;
    height: 22px;
    padding: 0 8px;
    border-radius: 999px;
    background: var(--sunken);
    color: var(--ink-muted);
    font-size: 0.74rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .recipe-card:has(input[data-recipe]:checked) .tag-chip { background: color-mix(in srgb, var(--card) 70%, transparent); }
  .meta-rating, .meta-time { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; white-space: nowrap; }
  .meta-rating { color: var(--ink); margin-right: 2px; }
  .meta-rating svg { width: 13px; height: 13px; fill: var(--star); }
  .meta-time svg { width: 12px; height: 12px; }
  .meta-time { margin-right: 2px; }
  .meta-cooked { color: var(--ink-faint); white-space: nowrap; }

  .tag-filters {
    display: flex;
    gap: 6px;
    margin-top: -6px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
    mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent);
    padding-right: 24px;
  }
  .tag-filters::-webkit-scrollbar { display: none; }
  .filter-chip, .tag-option {
    flex: none;
    height: 32px;
    padding: 0 12px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink-muted);
    font-weight: 600;
    font-size: 0.84rem;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 200ms var(--ease), border-color 200ms var(--ease), color 200ms var(--ease), transform 160ms var(--ease);
  }
  .filter-chip:hover, .tag-option:hover { color: var(--ink); border-color: var(--ink-faint); }
  .filter-chip:active, .tag-option:active { transform: scale(0.95); }
  .filter-chip:focus-visible, .tag-option:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filter-chip[aria-pressed="true"], .tag-option[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent-text); }

  .field .field-label { display: block; margin-bottom: 6px; font-size: 0.84rem; font-weight: 600; color: var(--ink); }
  .field-row-3 { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; align-items: end; }
  .rating-input { display: flex; align-items: center; height: 44px; }
  .star-btn {
    width: 30px;
    height: 40px;
    padding: 0;
    border: none;
    border-radius: 8px;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--line-strong);
    cursor: pointer;
    transition: color 160ms ease, transform 200ms var(--ease);
  }
  .star-btn svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; transition: fill 160ms ease; }
  .star-btn.is-on { color: var(--star); }
  .star-btn.is-on svg { fill: var(--star); }
  .star-btn:hover { transform: scale(1.12); }
  .star-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tag-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag-picker input[type="text"].tag-new {
    width: 128px;
    height: 32px;
    padding: 0 12px;
    border: 1px dashed var(--line-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-size: 16px;
  }
  .tag-picker input[type="text"].tag-new:focus { outline: none; border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .tag-option.entering { animation: checkPop 320ms var(--ease-soft); }

  /* ---------- Week by day ---------- */

  .week-strip { display: flex; flex-direction: column; gap: 8px; }
  .strip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .strip-title { margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.08rem; }
  .strip-note { font-size: 0.8rem; color: var(--ink-muted); text-align: right; }
  .day-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    min-width: 0;
    min-height: 96px;
    padding: 8px 2px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink-muted);
    font: inherit;
  }
  button.day-cell { cursor: pointer; transition: border-color 200ms var(--ease), transform 160ms var(--ease), background-color 200ms var(--ease); }
  button.day-cell:hover { border-color: var(--accent); }
  button.day-cell:active { transform: scale(0.95); }
  button.day-cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .day-cell.is-today { border-color: color-mix(in srgb, var(--accent) 70%, transparent); background: var(--accent-soft); }
  .day-name { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
  .day-cell.is-today .day-name { color: var(--accent-text); }
  .day-date { font-size: 1rem; font-weight: 700; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .day-tiles { display: flex; flex-direction: column; align-items: center; gap: 3px; margin-top: 3px; }
  .mini-tile {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    background: hsl(var(--hue, 152) var(--tile-s) var(--tile-bg-l));
    color: hsl(var(--hue, 152) 45% var(--tile-fg-l));
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 0.78rem;
    line-height: 1;
  }
  .mini-tile.is-leftover { background: transparent; border: 1.5px dashed hsl(var(--hue, 152) 35% 55%); }
  .mini-more { font-size: 0.7rem; font-weight: 700; color: var(--ink-muted); }
  .day-empty { width: 12px; height: 2px; margin-top: 11px; border-radius: 2px; background: var(--line-strong); }

  .week-servings { flex-wrap: wrap; row-gap: 8px; }
  .day-controls { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .pill-select {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 26px 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink-muted);
    font-weight: 600;
    font-size: 0.82rem;
    white-space: nowrap;
    cursor: pointer;
    transition: border-color 200ms var(--ease), color 200ms var(--ease), background-color 200ms var(--ease);
  }
  .pill-select svg { width: 14px; height: 14px; flex: none; }
  .pill-select::after {
    content: '';
    position: absolute;
    right: 11px;
    top: 50%;
    width: 5px;
    height: 5px;
    border-right: 1.6px solid currentColor;
    border-bottom: 1.6px solid currentColor;
    transform: translateY(-70%) rotate(45deg);
  }
  /* The real <select> covers the whole pill (so the native picker opens from anywhere on it). */
  .pill-select select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
  .pill-select:hover { color: var(--ink); border-color: var(--ink-faint); }
  .pill-select:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pill-select.is-set { color: var(--accent-text); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }

  .today-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
  }
  .today-kicker { margin: 0; font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent-text); }
  .today-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .today-list li { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .today-name { flex: 1; min-width: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 1.12rem; line-height: 1.25; overflow-wrap: anywhere; }
  .tile-xs { width: 32px; height: 32px; border-radius: 9px; font-size: 0.92rem; }
  .today-line { margin: 0; font-size: 0.9rem; color: var(--ink-muted); }
  .today-line strong { color: var(--ink); }
  .pill-day { font-size: 0.72rem; font-weight: 700; opacity: 0.72; }

  /* ---------- Cook-along ---------- */

  @keyframes alongIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes alongNext { from { opacity: 0; transform: translateX(32px); } to { opacity: 1; transform: none; } }
  @keyframes alongPrev { from { opacity: 0; transform: translateX(-32px); } to { opacity: 1; transform: none; } }
  @keyframes drawRing { from { stroke-dashoffset: 151; } to { stroke-dashoffset: 0; } }
  @keyframes drawTick { from { stroke-dashoffset: 34; } to { stroke-dashoffset: 0; } }

  html.along-open, html.along-open body { overflow: hidden; }
  .along {
    position: fixed;
    inset: 0;
    z-index: 85; /* under the timer tray (90), so running timers stay in view */
    display: flex;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
    background: radial-gradient(120% 300px at 50% -60px, var(--wash), transparent 75%) no-repeat, var(--paper);
  }
  .along.entering { animation: alongIn 420ms var(--ease) both; }
  .along-inner {
    width: 100%;
    max-width: 680px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 14px 16px calc(16px + var(--tray-h, 0px) + env(safe-area-inset-bottom, 0px));
  }
  .along-top { display: flex; align-items: center; gap: 4px; }
  .along-titles { flex: 1; min-width: 0; }

<script src="demo-seed.js"></script>
<script>
(function () {

  var cookSelected = {}; // recipeId -> true, which of this week's recipes are shown on the Cook tab

  var shoppingCombinedEl = document.getElementById('shoppingCombined');
  var shoppingByRecipeEl = document.getElementById('shoppingByRecipe');
  var viewToggleEl = document.getElementById('viewToggle');
  var itemCountEl = document.getElementById('itemCount');
  var clearCheckedBtn = document.getElementById('clearCheckedBtn');
  var statusEl = document.getElementById('statusLine');
  var statusTextEl = document.getElementById('statusText');
  var unitToggleEl = document.getElementById('unitToggle');
  var newRecipeBtn = document.getElementById('newRecipeBtn');
  var tabBarEl = document.getElementById('tabBar');
  var panelRecipesEl = document.getElementById('panelRecipes');
  var panelShopEl = document.getElementById('panelShop');
  var panelCookEl = document.getElementById('panelCook');
  var recipePillsEl = document.getElementById('recipePills');
  var cookContentEl = document.getElementById('cookContent');

  var modalBackdrop = document.getElementById('modalBackdrop');
  var modalTitleEl = document.getElementById('modalTitle');
  var modalBodyEl = document.getElementById('modalBody');
  var modalCloseBtn = document.getElementById('modalCloseBtn');
  var planSummaryEl = document.getElementById('planSummary');
  var shopCountEl = document.getElementById('shopCount');
  var cookCountEl = document.getElementById('cookCount');
  var shopSummaryEl = document.getElementById('shopSummary');
  var shopToolbarEl = document.getElementById('shopToolbar');
  var progressFillEl = document.getElementById('progressFill');
  var shopSummaryTextEl = document.getElementById('shopSummaryText');
  var lastShopComplete = null;

  // Each recipe gets a stable colour (keyed on its id, so renaming doesn't repaint it) from a
  // small curated set that stays clear of the green accent used for "planned" and actions.
  var RECIPE_HUES = [24, 214, 338, 44, 262, 6, 196, 300];
  function recipeHue(id) {
    var h = 0;
    id = String(id || '');
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return RECIPE_HUES[h % RECIPE_HUES.length];
  }
  function initialOf(name) {
    var t = String(name || '').trim();
    return t ? t.charAt(0).toUpperCase() : '?';
  }
  // ---------- Photos ----------
  // A recipe's photo is an asset id from the artifact's file store (synced), or — when the app is
  // only saved on this device — a small JPEG kept inline. Anything else is ignored.
  var ASSET_ID_RE = /^[0-9a-f]{32}$/;
  var DATA_PHOTO_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
  function cleanPhotoRef(v) {
    if (typeof v !== 'string') return '';
    if (ASSET_ID_RE.test(v)) return v;
    if (mode !== 'db' && v.length < 300000 && DATA_PHOTO_RE.test(v)) return v;
    return '';
  }
  function photoSrc(ref) {
    ref = cleanPhotoRef(ref);
    return !ref ? '' : ASSET_ID_RE.test(ref) ? '/_blob/' + ref : ref;
  }
  function recipePhotoSrc(id) { return recipes[id] ? photoSrc(recipes[id].photo) : ''; }

  function tileHtml(id, name, cls, withCheck) {
    var src = recipePhotoSrc(id);
    return '<span class="' + cls + (src ? ' has-photo' : '') + '" style="--hue:' + recipeHue(id) + '" aria-hidden="true">' +
      (src ? '<img class="tile-photo" alt="" src="' + escapeHtml(src) + '">' : '') +
      '<span class="tile-letter">' + escapeHtml(initialOf(name)) + '</span>' +
      (withCheck ? '<svg class="tile-check" viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') +
    '</span>';
  }
  function syncTile(tile, name, id) {
    if (!tile) return;
    var letter = tile.querySelector('.tile-letter');
    if (letter) letter.textContent = initialOf(name);
    if (id === undefined) return;
    var src = recipePhotoSrc(id);
    var img = tile.querySelector('.tile-photo');
    if (src && !img) { tile.insertAdjacentHTML('afterbegin', '<img class="tile-photo" alt="">'); img = tile.querySelector('.tile-photo'); }
    if (img && !src) { img.remove(); img = null; }
    if (img && img.getAttribute('src') !== src) img.setAttribute('src', src);
    tile.classList.toggle('has-photo', !!src);
  }
  // A photo that no longer loads (deleted elsewhere) falls back to the coloured letter.
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (!t || t.tagName !== 'IMG') return;
    if (t.classList.contains('tile-photo') || t.classList.contains('mini-photo')) { var tile = t.parentNode; t.remove(); if (tile) tile.classList.remove('has-photo'); }
    else if (t.classList.contains('cook-hero') || t.classList.contains('along-hero')) t.hidden = true;
  }, true);
  // A one-shot scale bump when a displayed number actually changes.
  function setNumber(el, value) {
    var t = String(value);
    if (el.textContent === t) return;
    var had = el.textContent !== '';
    el.textContent = t;
    if (had) markTransient(el, 'bump');
  }

  function defaultWeek() {
    return {
      items: {}, // recipeId -> servings, for whatever recipes are in this week's plan
      checked: {}, // shopping-row key -> true
      extras: [], // [{ id, name }] items added by hand, not from a recipe
      pantry: {}, // lower-cased ingredient name -> true: staples already at home (kept across weeks)
      days: {}, // recipeId -> 0..6 (Mon..Sun): the day it's cooked
      leftovers: {} // recipeId -> 0..6: a second day it's eaten as leftovers
    };
  }

  function cloneWeek(w) { return JSON.parse(JSON.stringify(w)); }

  function newId() {
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  // Order-insensitive: the database may hand keys back in a different order than we wrote them.
  function sameWeek(a, b) {
    function sameMap(x, y) {
      var kx = Object.keys(x), ky = Object.keys(y);
      if (kx.length !== ky.length) return false;
      for (var i = 0; i < kx.length; i++) if (x[kx[i]] !== y[kx[i]]) return false;
      return true;
    }
    function sameExtras(x, y) {
      if (x.length !== y.length) return false;
      for (var i = 0; i < x.length; i++) if (x[i].id !== y[i].id || x[i].name !== y[i].name || !!x[i].every !== !!y[i].every) return false;
      return true;
    }
    return sameMap(a.items, b.items) && sameMap(a.checked, b.checked) &&
      sameExtras(a.extras, b.extras) && sameMap(a.pantry, b.pantry) &&
      sameMap(a.days, b.days) && sameMap(a.leftovers, b.leftovers);
  }

  function normalizeWeek(data) {
    var w = defaultWeek();
    if (data && typeof data === 'object') {
      if (data.items && typeof data.items === 'object') {
        Object.keys(data.items).forEach(function (id) {
          var servings = Number(data.items[id]);
          if (servings > 0) w.items[id] = Math.max(1, servings);
        });
      }
      if (data.checked && typeof data.checked === 'object') {
        w.checked = Object.assign({}, data.checked);
      }
      if (Array.isArray(data.extras)) {
        w.extras = data.extras.filter(function (x) {
          return x && typeof x.id === 'string' && typeof x.name === 'string' && x.name.trim();
        }).map(function (x) { var o = { id: x.id, name: x.name.trim().slice(0, 80) }; if (x.every) o.every = true; return o; });
      }
      if (data.pantry && typeof data.pantry === 'object') {
        Object.keys(data.pantry).forEach(function (k) { if (data.pantry[k]) w.pantry[k] = true; });
      }
      // Days only mean something for a planned recipe; leftovers only after a cook day, on another day.
      ['days', 'leftovers'].forEach(function (f) {
        if (!data[f] || typeof data[f] !== 'object') return;
        Object.keys(data[f]).forEach(function (id) {
          var d = Number(data[f][id]);
          if (id in w.items && d >= 0 && d <= 6 && Math.floor(d) === d) w[f][id] = d;
        });
      });
      Object.keys(w.leftovers).forEach(function (id) {
        if (!(id in w.days) || w.days[id] === w.leftovers[id]) delete w.leftovers[id];
      });
    }
    return w;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Adds a one-shot animation-trigger class and guarantees its removal — via the animation's
  // own end, or its cancellation (e.g. the element's container is hidden before the animation
  // finishes playing, which cancels rather than completes it — "animationend" alone would never
  // fire then, permanently stranding the class and making the animation replay every time the
  // element becomes visible again), or, as a last-resort safety net, a timeout.
  function markTransient(el, cls, delayMs) {
    delayMs = delayMs || 0;
    if (delayMs) el.style.animationDelay = delayMs + 'ms';
    el.classList.add(cls);
    var done = false;
    function cleanup() {
      if (done) return;
      done = true;
      el.classList.remove(cls);
      el.style.animationDelay = '';
      el.removeEventListener('animationend', onEvent);
      el.removeEventListener('animationcancel', onEvent);
    }
    // Animation events bubble: ignore ones from descendants (a row inside this panel, a
    // checkbox inside this row), or a child finishing first would cut this one short.
    function onEvent(e) { if (e.target === el) cleanup(); }
    el.addEventListener('animationend', onEvent);
    el.addEventListener('animationcancel', onEvent);
    setTimeout(cleanup, delayMs + 1000);
  }

  function formatAmount(n) {
    if (!isFinite(n) || n <= 0) return '';
    var rounded = Math.round(n * 100) / 100;
    var s = rounded.toFixed(2);
    s = s.replace(/0+$/, '').replace(/\.$/, '');
    return s;
  }

  function setStatus(text, isLocal) {
    statusTextEl.textContent = text;
    statusEl.classList.toggle('is-local', !!isLocal);
  }

  // ---------- Unit conversion ----------

  var UNIT_ALIASES = {
    g: ['g', 'gram', 'grams', 'gr'],
    kg: ['kg', 'kilogram', 'kilograms'],
    oz: ['oz', 'ounce', 'ounces'],
    lb: ['lb', 'lbs', 'pound', 'pounds'],
    ml: ['ml', 'milliliter', 'milliliters', 'millilitre', 'millilitres'],
    l: ['l', 'liter', 'liters', 'litre', 'litres'],
    tsp: ['tsp', 'teaspoon', 'teaspoons'],
    tbsp: ['tbsp', 'tablespoon', 'tablespoons'],
    floz: ['fl oz', 'floz', 'fluid ounce', 'fluid ounces'],
    cup: ['cup', 'cups'],
    pint: ['pint', 'pints'],
    quart: ['quart', 'quarts'],
    gallon: ['gallon', 'gallons']
  };
  var UNIT_LOOKUP = {};
  Object.keys(UNIT_ALIASES).forEach(function (canon) {
    UNIT_ALIASES[canon].forEach(function (alias) { UNIT_LOOKUP[alias] = canon; });
  });
  var UNIT_CONV = {
    g: { kind: 'weight', toBase: 1 },
    kg: { kind: 'weight', toBase: 1000 },
    oz: { kind: 'weight', toBase: 28.3495 },
    lb: { kind: 'weight', toBase: 453.592 },
    ml: { kind: 'volume', toBase: 1 },
    l: { kind: 'volume', toBase: 1000 },
    tsp: { kind: 'volume', toBase: 4.92892 },
    tbsp: { kind: 'volume', toBase: 14.7868 },
    floz: { kind: 'volume', toBase: 29.5735 },
    cup: { kind: 'volume', toBase: 236.588 },
    pint: { kind: 'volume', toBase: 473.176 },
    quart: { kind: 'volume', toBase: 946.353 },
    gallon: { kind: 'volume', toBase: 3785.41 }
  };

  function normalizeUnitKey(raw) {
    var key = (raw || '').toString().trim().toLowerCase().replace(/\.$/, '');
    return UNIT_LOOKUP[key] || null;
  }

  function convertForDisplay(amount, rawUnit, system) {
    var canon = normalizeUnitKey(rawUnit);
    if (!canon || !UNIT_CONV[canon] || !amount) return { amount: amount, unit: rawUnit };
    var entry = UNIT_CONV[canon];
    var base = amount * entry.toBase;

    if (system === 'metric') {
      if (entry.kind === 'weight') {
        return base >= 1000 ? { amount: base / 1000, unit: 'kg' } : { amount: base, unit: 'g' };
      }
      return base >= 1000 ? { amount: base / 1000, unit: 'l' } : { amount: base, unit: 'ml' };
    }

    if (entry.kind === 'weight') {
      var ozVal = base / 28.3495;
      return ozVal >= 16 ? { amount: ozVal / 16, unit: 'lb' } : { amount: ozVal, unit: 'oz' };
    }
    if (base < 15) return { amount: base / 4.92892, unit: 'tsp' };
    if (base < 59) return { amount: base / 14.7868, unit: 'tbsp' };
    var cups = base / 236.588;
    if (cups >= 4) {
      var quarts = cups / 4;
      return quarts >= 4 ? { amount: quarts / 4, unit: 'gallon' } : { amount: quarts, unit: 'quart' };
    }
    return { amount: cups, unit: 'cup' };
  }

  function roundForUnit(amount, unit) {
    switch (unit) {
      case 'g': case 'ml': return Math.round(amount);
      case 'kg': case 'l': return Math.round(amount * 100) / 100;
      default: return snapFraction(amount); // kitchen measures read best as ½, ⅓, ¼…
    }
  }

  // Kitchen fractions: 0.333 cups reads as ⅓ cup, 1.5 lb as 1½ lb. Metric weights and volumes
  // stay decimal (nobody measures ½ g). Anything that isn't close to a common fraction keeps
  // its decimal rather than being bent to the wrong one.
  var FRACTIONS = [[1 / 8, '⅛'], [1 / 4, '¼'], [1 / 3, '⅓'], [3 / 8, '⅜'], [1 / 2, '½'], [5 / 8, '⅝'], [2 / 3, '⅔'], [3 / 4, '¾'], [7 / 8, '⅞']];
  function nearestFraction(frac) {
    var best = null;
    FRACTIONS.forEach(function (f) { if (Math.abs(f[0] - frac) <= 0.03 && (!best || Math.abs(f[0] - frac) < Math.abs(best[0] - frac))) best = f; });
    return best;
  }
  function snapFraction(n) {
    if (!(n > 0)) return n;
    var whole = Math.floor(n), frac = n - whole;
    if (frac < 0.03) return whole || Math.round(n * 100) / 100;
    if (frac > 0.97) return whole + 1;
    var f = nearestFraction(frac);
    return f ? whole + f[0] : Math.round(n * 100) / 100;
  }
  function amountText(n, unit) {
    if (!isFinite(n) || n <= 0) return '';
    if (unit === 'g' || unit === 'ml' || unit === 'kg' || unit === 'l') return formatAmount(n);
    var whole = Math.floor(n + 1e-9), frac = n - whole;
    if (frac < 0.01) return String(whole);
    var f = nearestFraction(frac);
    if (!f || Math.abs(f[0] - frac) > 0.005) return formatAmount(n);
    return (whole ? whole : '') + f[1];
  }

  // Count-style units, so "2 cans" and "3 cloves" read naturally.
  var UNIT_PLURALS = { can: 'cans', clove: 'cloves', jar: 'jars', head: 'heads', bunch: 'bunches', package: 'packages', pkg: 'pkgs', bag: 'bags', box: 'boxes', bottle: 'bottles', loaf: 'loaves', stalk: 'stalks', slice: 'slices', tin: 'tins', carton: 'cartons', pinch: 'pinches', sprig: 'sprigs', piece: 'pieces', stick: 'sticks', sheet: 'sheets', fillet: 'fillets', breast: 'breasts', thigh: 'thighs', pint: 'pints', handful: 'handfuls', dash: 'dashes' };
  function unitLabel(unit, amount) {
    if (unit === 'cup') return amount > 1.001 ? 'cups' : 'cup';
    if (unit === 'quart') return amount > 1.001 ? 'quarts' : 'quart';
    if (unit === 'gallon') return amount > 1.001 ? 'gallons' : 'gallon';
    var key = String(unit || '').trim().toLowerCase();
    if (key === 'each' || key === 'ea' || key === 'whole') return ''; // "3 eggs", not "3 each eggs"
    if (amount > 1.001 && UNIT_PLURALS[key]) return UNIT_PLURALS[key];
    return unit;
  }

  // On the shopping list, things sold whole round up: 1.5 cans to buy is 2 cans.
  var COUNT_UNIT_RE = /^(|each|ea|whole|can|cans|jar|jars|head|heads|bunch|bunches|package|packages|pkg|pkgs|bag|bags|box|boxes|bottle|bottles|loaf|loaves|tin|tins|carton|cartons|clove|cloves|stalk|stalks|piece|pieces|fillet|fillets|breast|breasts|thigh|thighs|large|medium|small)$/;
  function buyAmount(it) {
    var unit = String(it.unit || '').trim().toLowerCase();
    if (!(it.amount > 0) || !COUNT_UNIT_RE.test(unit)) return null;
    var up = Math.ceil(it.amount - 0.02);
    return up > it.amount + 0.02 ? up : null;
  }
  function shopAmountHtml(it) {
    var up = buyAmount(it);
    if (!up) return formatIngredientForList(it.amount, it.unit);
    return formatIngredientForList(up, it.unit) + '<small class="need-exact">' + escapeHtml(amountText(snapFraction(it.amount), it.unit)) + ' needed</small>';
  }

  function renderUnitToggle() {
    unitToggleEl.querySelectorAll('.unit-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-system') === unitSystem);
    });
  }

  unitToggleEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.unit-btn');
    if (!btn) return;
    unitSystem = btn.getAttribute('data-system');
    try { localStorage.setItem('sous_chef_unit_system', unitSystem); } catch (err) {}
    renderUnitToggle();
    renderShopping();
  });

  function renderViewToggle() {
    viewToggleEl.querySelectorAll('.unit-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-view') === shoppingView);
    });
  }

  viewToggleEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.unit-btn');
    if (!btn) return;
    shoppingView = btn.getAttribute('data-view');
    try { localStorage.setItem('sous_chef_shopping_view', shoppingView); } catch (err) {}
    renderViewToggle();
    renderShopping();
  });

  // ---------- Persistence ----------

  function persistLocalRecipes() {
    try { localStorage.setItem('larder_recipes', JSON.stringify(recipes)); }
    catch (e) { showToast('This device’s storage is full — remove a photo or two so changes can be saved'); }
  }
  function persistLocalWeek() {
    try { localStorage.setItem('larder_week', JSON.stringify(week)); } catch (e) {}
  }

  // In synced mode a recipe change shows immediately; snapshots from the database that arrive
  // while our own writes are still in flight are older than what's on screen, so they're held
  // and the newest one is applied once those writes settle (same approach as the week plan).
  var recipeWritesInFlight = 0;
  var heldServerRecipes = null;
  function trackRecipeWrite(promise) {
    recipeWritesInFlight++;
    promise
      .catch(function () { setStatus('Could not save — try again', true); })
      .then(function () {
        recipeWritesInFlight--;
        if (!recipeWritesInFlight && heldServerRecipes) {
          recipes = heldServerRecipes;
          heldServerRecipes = null;
          renderVisible();
        }
      });
  }

  function saveRecipeRecord(id, data) {
    recipes[id] = data;
    if (mode === 'db') trackRecipeWrite(db.collection('recipes').doc(id).set(data));
    else persistLocalRecipes();
    renderVisible();
  }
