  function choiceHtml() {
    return (
      '<div class="modal-choice">' +
        '<button type="button" class="choice-card" data-action="choose-manual">' +
          '<span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></span>' +
          '<span class="choice-title">Type it in</span>' +
          '<span class="choice-desc">Enter the name, servings, and ingredients yourself.</span>' +
        '</button>' +
        '<button type="button" class="choice-card" data-action="choose-paste"' + (sampleApi ? '' : ' disabled') + '>' +
          '<span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg></span>' +
          '<span class="choice-title">Find a recipe</span>' +
          '<span class="choice-desc">' + (sampleApi ? 'Search the web, paste a link, or paste the ingredient list — AI sorts it into fields.' : 'AI parsing isn’t available in this view.') + '</span>' +
        '</button>' +
      '</div>'
    );
  }

  function domainFromUrl(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
  }

  function searchResultsHtml() {
    if (modalState.searching) return '';
    if (!modalState.searchResults) return '';
    if (!modalState.searchResults.length) return '<p class="empty-note">No recipes found — try different words, or paste a link below.</p>';
    return '<div class="search-results">' + modalState.searchResults.map(function (r, i) {
      var domain = domainFromUrl(r.url);
      var snippet = (r.excerpts && r.excerpts[0]) ? r.excerpts[0].replace(/\s+/g, ' ').trim().slice(0, 140) : '';
      return (
        '<button type="button" class="search-result" data-action="pick-result" data-index="' + i + '">' +
          '<span class="search-result-title">' + escapeHtml(r.title || domain || r.url) + '</span>' +
          (domain ? '<span class="search-result-domain">' + escapeHtml(domain) + '</span>' : '') +
          (snippet ? '<span class="search-result-snippet">' + escapeHtml(snippet) + '…</span>' : '') +
        '</button>'
      );
    }).join('') + '</div>';
  }

  function pasteHtml() {
    return (
      '<div class="modal-paste">' +
        '<div class="search-row">' +
          '<input type="text" id="searchQuery" placeholder="Search for a recipe, e.g. chicken tikka masala" value="' + escapeHtml(modalState.searchQuery) + '">' +
          '<button type="button" class="btn btn-accent' + (modalState.searching ? ' is-loading' : '') + '" data-action="do-search"' + (modalState.searching ? ' disabled' : '') + '>' + (modalState.searching ? 'Searching…' : 'Search') + '</button>' +
        '</div>' +
        (modalState.searchError ? '<div class="form-error">' + escapeHtml(modalState.searchError) + '</div>' : '') +
        searchResultsHtml() +
        '<div class="paste-divider"><span>or paste a link / ingredient text</span></div>' +
        '<textarea id="pasteText" class="form-textarea" rows="6" placeholder="https://example.com/recipe&#10;&#10;...or paste the ingredient list itself">' + escapeHtml(modalState.pasteText) + '</textarea>' +
        '<p class="paste-tip">A page that doesn’t fetch cleanly (paywalled or heavy on JavaScript)? Copy the ingredient list itself and paste that instead — running the link through ' +
        '<a href="https://justtherecipe.com" target="_blank" rel="noopener">justtherecipe.com</a> first can help.</p>' +
        '<div class="form-error">' + (modalState.parseError ? escapeHtml(modalState.parseError) : '') + '</div>' +
        '<div class="form-actions">' +
          '<button type="button" class="btn btn-outline" data-action="back-choice">Back</button>' +
          '<button type="button" class="btn btn-accent' + (modalState.parsing ? ' is-loading' : '') + '" data-action="do-parse"' + (modalState.parsing ? ' disabled' : '') + '>' + (modalState.parsing ? (modalState.parsingLabel || 'Reading…') : 'Get recipe') + '</button>' +
        '</div>' +
      '</div>'
    );
  }

  function manualHtml() {
    var p = modalState.prefill || {};
    var name = p.name || '';
    var baseServings = p.baseServings || 4;
    var ingredientsSrc = (p.ingredients && p.ingredients.length) ? p.ingredients : [{}, {}, {}];
    var instructionsText = (p.instructions && p.instructions.length) ? p.instructions.join('\n') : '';
    var showBack = modalState.origin === 'new' && sampleApi;
    return (
      '<div class="recipe-form-fields">' +
        '<div class="field-row">' +
          '<div class="field"><label for="rfName">Recipe name</label><input type="text" id="rfName" placeholder="Weeknight spaghetti" value="' + escapeHtml(name) + '"></div>' +
          '<div class="field"><label for="rfServings">Servings</label><input type="number" id="rfServings" min="1" max="50" value="' + baseServings + '"></div>' +
        '</div>' +
        '<div>' +
          '<div class="ingredients-label">Ingredients</div>' +
          '<div class="ingredient-head" aria-hidden="true"><span>Qty</span><span>Unit</span><span>Ingredient</span></div>' +
          '<div class="ingredient-rows" id="rfIngredients">' + ingredientsSrc.map(ingredientRowHtml).join('') + '</div>' +
          '<button class="btn-text" type="button" data-action="add-ingredient">+ Add ingredient</button>' +
        '</div>' +
        '<div>' +
          '<div class="ingredients-label">Directions</div>' +
          '<textarea id="rfInstructions" class="form-textarea" rows="5" placeholder="Preheat oven to 375°F...&#10;Mix the dry ingredients...&#10;...">' + escapeHtml(instructionsText) + '</textarea>' +
        '</div>' +
        '<div class="form-error" id="rfError"></div>' +
        '<div class="form-actions">' +
          (modalState.origin === 'edit'
            ? '<div class="delete-zone">' +
                '<button type="button" class="btn-text btn-danger-text" data-action="delete">Delete</button>' +
                '<span class="confirm-row">Delete this recipe?' +
                  '<button type="button" class="btn btn-outline" data-action="cancel-delete">Keep</button>' +
                  '<button type="button" class="btn btn-danger" data-action="confirm-delete">Delete</button>' +
                '</span>' +
              '</div>'
            : '') +
          '<div class="save-zone">' +
            (showBack
              ? '<button type="button" class="btn btn-outline" data-action="back-choice">Back</button>'
              : '<button type="button" class="btn btn-outline" data-action="close-modal">Cancel</button>') +
            '<button type="button" class="btn btn-accent" data-action="save-recipe">Save recipe</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function renderModal() {
    if (modalState.mode === 'choice') {
      modalTitleEl.textContent = 'New recipe';
      modalBodyEl.innerHTML = choiceHtml();
    } else if (modalState.mode === 'paste') {
      modalTitleEl.textContent = 'Find a recipe';
      modalBodyEl.innerHTML = pasteHtml();
    } else if (modalState.mode === 'manual') {
      modalTitleEl.textContent = modalState.origin === 'edit' ? 'Edit recipe' : 'New recipe';
      modalBodyEl.innerHTML = manualHtml();
    }
  }

  function openModal(modeName, opts) {
    opts = opts || {};
    modalState.mode = modeName;
    modalState.origin = opts.origin || modalState.origin || 'new';
    modalState.editId = 'editId' in opts ? opts.editId : null;
    modalState.prefill = 'prefill' in opts ? opts.prefill : null;
    if (modeName !== 'paste') { modalState.parseError = ''; modalState.parsing = false; }
    modalBackdrop.hidden = false;
    renderModal();
  }

  function closeModal() {
    modalBackdrop.hidden = true;
    modalState = { mode: null, origin: 'new', editId: null, prefill: null, parseError: '', parsing: false, pasteText: '', searchQuery: '', searchResults: null, searching: false, searchError: '' };
  }

  function saveFromModalForm() {
    var nameInput = document.getElementById('rfName');
    var servingsInput = document.getElementById('rfServings');
    var ingredientsWrap = document.getElementById('rfIngredients');
    var instructionsInput = document.getElementById('rfInstructions');
    var errorEl = document.getElementById('rfError');

    var name = nameInput.value.trim();
    var baseServings = Math.max(1, parseInt(servingsInput.value, 10) || 1);
    var rows = Array.prototype.slice.call(ingredientsWrap.querySelectorAll('.ingredient-row'));
    var ingredients = rows.map(function (row) {
      return {
        amount: parseFloat(row.querySelector('.ing-amount').value) || 0,
        unit: row.querySelector('.ing-unit').value.trim(),
        name: row.querySelector('.ing-name').value.trim()
      };
    }).filter(function (ing) { return ing.name; });
    var instructions = instructionsInput.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s; });

    if (!name) { errorEl.textContent = 'Give the recipe a name.'; return; }
    if (!ingredients.length) { errorEl.textContent = 'Add at least one ingredient.'; return; }

    var id = modalState.editId || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : 'r' + Date.now() + Math.random().toString(16).slice(2));
    saveRecipeRecord(id, { name: name, baseServings: baseServings, ingredients: ingredients, instructions: instructions });
    closeModal();
  }

  function isUrlOnly(text) {
    return /^https?:\/\/\S+$/i.test(text.trim());
  }

  function mcpErrorMessage(err, context) {
    var code = err && err.code;
    var isSearch = context === 'search';
    if (code === 'needs_reauth') return 'Parallel Search needs to be reconnected — check claude.ai Settings → Connectors.';
    if (code === 'server_not_connected') return 'Parallel Search isn’t connected — add it in claude.ai Settings → Connectors.';
    if (code === 'selection_required') return 'Choose a Parallel Search connection in claude.ai, then try again.';
    if (code === 'tool_error') return (err && err.message) || (isSearch ? 'That search didn’t go through — try again or paste a link instead.' : 'That link couldn’t be fetched — try pasting the ingredient text instead.');
    if (code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
      return isSearch ? 'Recipe search isn’t available in this view — paste a link or the ingredient text instead.' : 'Link fetching isn’t available in this view — paste the ingredient text instead.';
    }
    return isSearch ? 'Couldn’t search right now — try again or paste a link instead.' : 'Couldn’t fetch that link — try pasting the ingredient text instead.';
  }

  function sampleErrorMessage(err) {
    if (err && err.code === 'not_granted') return 'AI parsing needs your permission — try again and allow it when prompted.';
    if (err && err.code === 'rate_limited') return 'Too many requests right now — wait a moment and try again.';
    return 'Something went wrong reading that — try again or enter it manually.';
  }

  function fetchAndParseUrl(url) {
    if (!mcpApi) {
      modalState.parseError = 'Link fetching isn’t available right now — paste the ingredient text instead.';
      renderModal();
      return;
    }
    modalState.parsing = true;
    modalState.parsingLabel = 'Reading the page…';
    modalState.parseError = '';
    renderModal();

    mcpApi.callTool('Parallel Search', 'web_fetch', {
      urls: [url],
      objective: 'Extract the recipe title, servings or yield, and the full ingredient list with quantities and units',
      search_queries: ['recipe ingredients list'],
      session_id: mcpSessionId
    }).then(function (result) {
      var payload = result && result.payload;
      var pageResult = payload && Array.isArray(payload.results) ? payload.results[0] : null;
      if (!pageResult) {
        modalState.parsing = false;
        var apiErr = payload && Array.isArray(payload.errors) && payload.errors[0];
        modalState.parseError = (apiErr && (apiErr.message || apiErr.error)) || 'Couldn’t read that page — try pasting the ingredient text instead.';
        renderModal();
        return;
      }
      var text = (pageResult.excerpts && pageResult.excerpts.length ? pageResult.excerpts.join('\n\n') : '') || pageResult.full_content || '';
      if (!text) {
        modalState.parsing = false;
        modalState.parseError = 'That page didn’t return any readable content — try pasting the ingredient text instead.';
        renderModal();
        return;
      }
      if (pageResult.title) text = 'PAGE TITLE: ' + pageResult.title + '\n\n' + text;
      runAiParse(text);
    }).catch(function (err) {
      modalState.parsing = false;
      modalState.parseError = mcpErrorMessage(err);
      renderModal();
    });
  }

  function doSearch() {
    var input = document.getElementById('searchQuery');
    var query = input.value.trim();
    modalState.searchQuery = query;
    if (!query) return;

    if (!mcpApi) {
      modalState.searchError = 'Recipe search isn’t available right now — paste a link or the ingredient text below instead.';
      renderModal();
      return;
    }
    modalState.searching = true;
    modalState.searchError = '';
    modalState.searchResults = null;
    renderModal();

    mcpApi.callTool('Parallel Search', 'web_search', {
      objective: 'Find a well-reviewed recipe with a full ingredient list and instructions for: ' + query,
      search_queries: [query + ' recipe'],
      session_id: mcpSessionId
    }).then(function (result) {
      modalState.searching = false;
      var payload = result && result.payload;
      var results = payload && Array.isArray(payload.results) ? payload.results : [];
      modalState.searchResults = results.filter(function (r) { return r && r.url; }).slice(0, 6);
      renderModal();
    }).catch(function (err) {
      modalState.searching = false;
      modalState.searchError = mcpErrorMessage(err, 'search');
      renderModal();
    });
  }

  function pickSearchResult(index) {
    var r = modalState.searchResults && modalState.searchResults[index];
    if (!r || !r.url) return;
    modalState.pasteText = r.url;
    fetchAndParseUrl(r.url);
  }

  function doParse() {
    var raw = document.getElementById('pasteText').value;
    modalState.pasteText = raw;
    var trimmed = raw.trim();
    if (!trimmed) return;

    if (isUrlOnly(trimmed)) {
      fetchAndParseUrl(trimmed);
      return;
    }

    if (!sampleApi) {
      modalState.parseError = 'AI parsing isn’t available right now — try Type it in instead.';
      renderModal();
      return;
    }
    modalState.parsing = true;
    modalState.parsingLabel = 'Sorting ingredients…';
    modalState.parseError = '';
    renderModal();
    runAiParse(trimmed);
  }

  function runAiParse(text) {
    if (!sampleApi) {
      modalState.parsing = false;
      modalState.parseError = 'AI parsing isn’t available right now — try Type it in instead.';
      renderModal();
      return;
    }
    modalState.parsingLabel = 'Sorting ingredients…';
    renderModal();

    var prompt = 'Extract a cooking recipe from the following text into JSON with this exact shape: ' +
      '{"name": string, "baseServings": number, "ingredients": [{"amount": number, "unit": string, "name": string}], "instructions": [string]}. ' +
      'Use the servings or yield stated in the text if present, otherwise default to 4. ' +
      'Split each ingredient line into a numeric amount, a short unit (e.g. g, kg, oz, lb, ml, l, tsp, tbsp, cup, clove, bunch, can, pinch, each — use "each" or an empty string for count-only items), ' +
      'and the ingredient name without quantity words. If an ingredient has no clear numeric amount, use amount 0 and put descriptive text like "to taste" in the unit field. ' +
      'For "instructions", give each distinct cooking step as one string in order (split a numbered or paragraph list of steps into separate array entries; omit the step numbers themselves). ' +
      'Only include actual recipe ingredients and steps — ignore ads or unrelated text. Return ONLY the JSON object, no other text.\n\nTEXT:\n' + text;

    sampleApi.json(prompt).then(function (result) {
      modalState.parsing = false;
      if (!result || !Array.isArray(result.ingredients) || !result.ingredients.length) {
        modalState.parseError = 'Couldn’t find any ingredients there — try pasting just the ingredient list.';
        renderModal();
        return;
      }
      var prefill = {
        name: (result.name || '').toString().slice(0, 120) || 'New recipe',
        baseServings: Math.max(1, parseInt(result.baseServings, 10) || 4),
        ingredients: result.ingredients.slice(0, 60).map(function (i) {
          return { amount: parseFloat(i.amount) || 0, unit: (i.unit || '').toString().slice(0, 24), name: (i.name || '').toString().slice(0, 80) };
        }).filter(function (i) { return i.name; }),
        instructions: Array.isArray(result.instructions) ? result.instructions.slice(0, 40).map(function (s) {
          return s.toString().trim().slice(0, 300);
        }).filter(Boolean) : []
      };
      if (!prefill.ingredients.length) {
        modalState.parseError = 'Couldn’t find any ingredients there — try pasting just the ingredient list.';
        renderModal();
        return;
      }
      openModal('manual', { origin: 'new', editId: null, prefill: prefill });
    }).catch(function (err) {
      modalState.parsing = false;
      modalState.parseError = sampleErrorMessage(err);
      renderModal();
    });
  }

  modalBodyEl.addEventListener('click', function (e) {
    var action = e.target.closest('[data-action]');
    if (action) {
      switch (action.getAttribute('data-action')) {
        case 'choose-manual': openModal('manual', { origin: 'new', editId: null, prefill: null }); break;
        case 'choose-paste': openModal('paste', { origin: 'new' }); break;
        case 'back-choice': openModal('choice', { origin: 'new', editId: null, prefill: null }); break;
        case 'close-modal': closeModal(); break;
        case 'add-ingredient':
          document.getElementById('rfIngredients').insertAdjacentHTML('beforeend', ingredientRowHtml());
          break;
        case 'do-parse':
          doParse();
          break;
        case 'do-search':
          doSearch();
          break;
        case 'pick-result':
          pickSearchResult(parseInt(action.getAttribute('data-index'), 10));
          break;
        case 'save-recipe': saveFromModalForm(); break;
        // Toggle the footer in place rather than re-rendering the form, so unsaved edits survive.
        case 'delete': action.closest('.form-actions').classList.add('confirming'); break;
        case 'cancel-delete': action.closest('.form-actions').classList.remove('confirming'); break;
        case 'confirm-delete':
          var delId = modalState.editId;
          closeModal();
          if (delId) deleteRecipeRecord(delId);
          break;
      }
      return;
    }
    var removeBtn = e.target.closest('.remove-ing');
    if (removeBtn) {
      var wrap = document.getElementById('rfIngredients');
      var rows = wrap.querySelectorAll('.ingredient-row');
      if (rows.length > 1) removeBtn.closest('.ingredient-row').remove();
      else removeBtn.closest('.ingredient-row').querySelectorAll('input').forEach(function (i) { i.value = ''; });
    }
  });

  modalBodyEl.addEventListener('input', function (e) {
    if (e.target.id === 'pasteText') modalState.pasteText = e.target.value;
    else if (e.target.id === 'searchQuery') modalState.searchQuery = e.target.value;
  });

  modalBodyEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'searchQuery') {
      e.preventDefault();
      doSearch();
    }
  });

  modalBackdrop.addEventListener('click', function (e) {
    if (e.target === modalBackdrop) closeModal();
  });
  modalCloseBtn.addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !modalBackdrop.hidden) closeModal();
  });

  newRecipeBtn.addEventListener('click', function () {
    openModal(sampleApi ? 'choice' : 'manual', { origin: 'new', editId: null, prefill: null });
  });

  // ---------- Event delegation (main page) ----------

  function playCheckPop(checkbox) {
    // A JS-driven, one-shot class rather than a stateless :checked selector — the latter
    // would replay every time the row became visible again after being [hidden] (e.g. a
    // tab switch), not just on the actual check action.
    if (!checkbox.checked) return;
    markTransient(checkbox, 'just-checked');
  }

  recipeListEl.addEventListener('change', function (e) {
    if (e.target.matches('input[type="checkbox"][data-recipe]')) {
      playCheckPop(e.target);
      toggleRecipeIncluded(e.target.getAttribute('data-recipe'), e.target.checked);
    }
  });

  recipeListEl.addEventListener('click', function (e) {
    var stepper = e.target.closest('.stepper');
    if (stepper) {
      adjustItemServings(stepper.getAttribute('data-recipe'), parseInt(stepper.getAttribute('data-delta'), 10));
      return;
    }

    var editBtn = e.target.closest('[data-action="edit"]');
    if (editBtn) {
      var id = editBtn.getAttribute('data-id');
      openModal('manual', { origin: 'edit', editId: id, prefill: recipes[id] });
    }
  });

  // "Go to Recipes" links in empty states.
  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-goto]');
    if (go) setActiveTab(go.getAttribute('data-goto'));
  });

  panelShopEl.addEventListener('change', function (e) {
    if (e.target.matches('input[type="checkbox"]')) {
      playCheckPop(e.target);
      toggleChecked(e.target.getAttribute('data-key'));
    }
  });
  clearCheckedBtn.addEventListener('click', clearChecked);

  // ---------- Init ----------

  function renderAll() {
    renderVisible();
  }

  renderUnitToggle();
  renderViewToggle();
  renderAll();
  setActiveTab(activeTab);

  function initLocalFallback() {
    mode = 'local';
    try { recipes = JSON.parse(localStorage.getItem('larder_recipes') || '{}'); } catch (e) { recipes = {}; }
    try { week = normalizeWeek(JSON.parse(localStorage.getItem('larder_week') || 'null')); } catch (e) { week = defaultWeek(); }
    setStatus('Saved on this device', true);
    renderAll();
  }

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(function (ns) { sampleApi = ns; }).catch(function () {});
    window.claude.use('mcp').then(function (ns) { mcpApi = ns; }).catch(function () {});

    window.claude.use('db').then(function (namespace) {
      if (!namespace) { initLocalFallback(); return; }
      db = namespace;
      mode = 'db';
      var gotRecipes = false, gotWeek = false;
      function checkReady() { if (gotRecipes && gotWeek) setStatus('Synced', false); }

      db.collection('recipes').onSnapshot(function (snap) {
        recipes = {};
        snap.docs.forEach(function (d) { recipes[d.id] = d.data(); });
        gotRecipes = true;
        renderVisible();
        checkReady();
      }, function () { setStatus('Sync error — reload to retry', true); });

      db.doc('mealplan/week').onSnapshot(function (snap) {
        var incoming = snap.exists ? normalizeWeek(snap.data()) : defaultWeek();
        gotWeek = true;
        latestServerWeek = incoming;
        // Older than what's on screen while our own changes are still on their way — see
        // weekHasUnsavedChanges. It's applied (if still different) once they settle.
        if (weekHasUnsavedChanges()) { checkReady(); return; }
        // A write we just made locally echoes back through this same snapshot listener —
        // skip the re-render when nothing actually changed, so it doesn't replay list animations.
        if (sameWeek(incoming, week)) { checkReady(); return; }
        week = incoming;
        renderVisible();
        checkReady();
      }, function () { setStatus('Sync error — reload to retry', true); });
    }).catch(function () { initLocalFallback(); });
  } else {
    initLocalFallback();
  }
})();
</script>

</body></html>
