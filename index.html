    var r = recipes[id];
    if (!r || ratingOf(r) === rating) return;
    var copy = JSON.parse(JSON.stringify(r));
    copy.rating = rating;
    saveRecipeRecord(id, copy);
  }

  function miniTileHtml(id, leftover) {
    var name = recipes[id].name;
    var src = leftover ? '' : recipePhotoSrc(id);
    return '<span class="mini-tile' + (leftover ? ' is-leftover' : '') + (src ? ' has-photo' : '') + '" style="--hue:' + recipeHue(id) + '" title="' + escapeHtml(name + (leftover ? ' (leftovers)' : '')) + '">' +
      (src ? '<img class="mini-photo" alt="" src="' + escapeHtml(src) + '">' : escapeHtml(initialOf(name))) + '</span>';
  }

  function renderWeekStrip() {
    var ids = cookRecipeIds();
    weekStripEl.hidden = !ids.length;
    if (!ids.length) return;
    var today = todayIndex();
    var start = new Date();
    start.setHours(12, 0, 0, 0);
    var cells = [0, 1, 2, 3, 4, 5, 6].map(function (k) {
      var i = (today + k) % 7, d = DAY_SHORT[i];
      var date = new Date(start);
      date.setDate(start.getDate() + k);
      var entries = ids.filter(function (id) { return dayOf(id) === i; }).map(function (id) { return [id, false]; })
        .concat(ids.filter(function (id) { return leftoverOf(id) === i; }).map(function (id) { return [id, true]; }));
      var tiles = entries.slice(0, 3).map(function (e) { return miniTileHtml(e[0], e[1]); }).join('') +
        (entries.length > 3 ? '<span class="mini-more">+' + (entries.length - 3) + '</span>' : '');
      var label = DAY_LONG[i] + (i === today ? ' (today)' : '') + ': ' + (entries.length
        ? entries.map(function (e) { return recipes[e[0]].name + (e[1] ? ' leftovers' : ''); }).join(', ')
        : 'nothing planned');
      var cls = 'day-cell' + (i === today ? ' is-today' : '');
      var inner = '<span class="day-name">' + d + '</span><span class="day-date">' + date.getDate() + '</span>' +
        '<span class="day-tiles">' + (tiles || '<span class="day-empty"></span>') + '</span>';
      return entries.length
        ? '<button type="button" class="' + cls + '" data-day="' + i + '" aria-label="' + escapeHtml(label) + '">' + inner + '</button>'
        : '<div class="' + cls + '" role="img" aria-label="' + escapeHtml(label) + '">' + inner + '</div>';
    }).join('');
    var unscheduled = ids.filter(function (id) { return dayOf(id) < 0; }).length;
    var note = unscheduled === ids.length ? 'Pick a day on each recipe below'
      : unscheduled ? unscheduled + ' without a day yet' : 'Tap a day to cook it';
    var html = '<div class="strip-head"><h2 class="strip-title">This week</h2><span class="strip-note">' + note + '</span></div>' +
      '<div class="day-grid">' + cells + '</div>';
    if (weekStripEl.getAttribute('data-src') !== html) { weekStripEl.setAttribute('data-src', html); weekStripEl.innerHTML = html; }
  }

  function openDayInCook(day) {
    var ids = cookRecipeIds();
    var cooks = ids.filter(function (id) { return dayOf(id) === day; });
    var pick = cooks.length ? cooks : ids.filter(function (id) { return leftoverOf(id) === day; });
    if (!pick.length) return;
    cookSelected = {};
    pick.forEach(function (id) { cookSelected[id] = true; });
    cookSelectionTouched = true;
    setActiveTab('cook');
    window.scrollTo(0, 0);
  }

  function renderTagFilters(tags) {
    var html = tags.map(function (t) {
      return '<button type="button" class="filter-chip" data-tag-filter="' + escapeHtml(t) + '" aria-pressed="' + (t === tagFilter ? 'true' : 'false') + '">' + escapeHtml(t) + '</button>';
    }).join('');
    if (tagFiltersEl.getAttribute('data-src') !== html) { tagFiltersEl.setAttribute('data-src', html); tagFiltersEl.innerHTML = html; }
  }

  function recipeCardHtml(id) {
    var r = recipes[id];
    var included = id in week.items;
    var servingsHtml = included ? servingsControlHtml(id, week.items[id]) : '';

    return (
      '<li class="recipe-card">' +
        '<label class="recipe-select">' +
          '<span class="plan-toggle">' +
            '<input type="checkbox" data-recipe="' + id + '"' + (included ? ' checked' : '') + ' aria-label="Include ' + escapeHtml(r.name) + ' this week">' +
            tileHtml(id, r.name, 'tile', true) +
          '</span>' +
          '<span class="recipe-info">' +
            '<span class="recipe-name">' + escapeHtml(r.name) + '</span>' +
            '<span class="recipe-meta">' + recipeMetaText(r) + '</span>' +
            '<span class="recipe-extra"></span>' +
          '</span>' +
        '</label>' +
        '<div class="recipe-actions">' +
          '<button class="icon-btn fav-btn' + (r.favorite ? ' is-fav' : '') + '" data-action="favorite" data-id="' + id + '" aria-pressed="' + (r.favorite ? 'true' : 'false') + '" aria-label="Favorite ' + escapeHtml(r.name) + '" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button>' +
          '<button class="icon-btn" data-action="edit" data-id="' + id + '" aria-label="Edit ' + escapeHtml(r.name) + '" type="button">' + editIconSvg() + '</button>' +
        '</div>' +
        servingsHtml +
      '</li>'
    );
  }

  function updateRecipeCardEl(el, id) {
    var r = recipes[id];
    var included = id in week.items;

    var nameEl = el.querySelector('.recipe-name');
    if (nameEl) nameEl.textContent = r.name;
    syncTile(el.querySelector('.tile'), r.name, id);
    var favBtn = el.querySelector('.fav-btn');
    if (favBtn) {
      favBtn.classList.toggle('is-fav', !!r.favorite);
      favBtn.setAttribute('aria-pressed', r.favorite ? 'true' : 'false');
    }
    var metaEl = el.querySelector('.recipe-meta');
    if (metaEl) metaEl.textContent = recipeMetaText(r);
    var extraEl = el.querySelector('.recipe-extra');
    var extraHtml = recipeExtraHtml(r);
    if (extraEl && extraEl.getAttribute('data-src') !== extraHtml) { extraEl.setAttribute('data-src', extraHtml); extraEl.innerHTML = extraHtml; }

    // Patch the checkbox's state in place rather than recreating it — recreating it would
    // replay its "checked" pop animation on every unrelated card re-render.
    var checkbox = el.querySelector('.recipe-select input[type="checkbox"]');
    if (checkbox) {
      if (checkbox.checked !== included) checkbox.checked = included;
      checkbox.setAttribute('aria-label', 'Include ' + r.name + ' this week');
    }

    var servingsWrap = el.querySelector('.week-servings');
    if (included) {
      var valueEl = servingsWrap && servingsWrap.querySelector('.servings-value');
      if (valueEl) {
        setNumber(valueEl, week.items[id]);
      } else if (!servingsWrap) {
        el.insertAdjacentHTML('beforeend', servingsControlHtml(id, week.items[id]));
      }
      syncDayControls(el, id);
    } else if (servingsWrap) {
      servingsWrap.remove();
    }
  }

  function recipeMatches(r, q) {
    if (!q) return true;
    if ((r.name || '').toLowerCase().indexOf(q) !== -1) return true;
    if (recipeTags(r).some(function (t) { return t.toLowerCase().indexOf(q) !== -1; })) return true;
    return (r.ingredients || []).some(function (ing) { return (ing.name || '').toLowerCase().indexOf(q) !== -1; });
  }

  function renderRecipes() {
    if (panelRecipesEl.hidden) return; // refreshed when the tab is shown (setActiveTab)
    var all = Object.keys(recipes);
    var anyFavorite = all.some(function (id) { return recipes[id].favorite; });
    if (!anyFavorite) favoritesOnly = false;
    // Favorites first, then A–Z.
    var ids = all.sort(function (a, b) {
      var fa = recipes[a].favorite ? 0 : 1, fb = recipes[b].favorite ? 0 : 1;
      return fa - fb || (recipes[a].name || '').localeCompare(recipes[b].name || '');
    });

    var tags = allTags();
    if (tagFilter && tags.indexOf(tagFilter) === -1) tagFilter = '';
    recipeEmptyNoteEl.hidden = all.length > 0;
    recipeToolsEl.hidden = !(all.length >= 4 || anyFavorite || recipeQuery || tags.length);
    favFilterBtn.hidden = !anyFavorite;
    favFilterBtn.setAttribute('aria-pressed', favoritesOnly ? 'true' : 'false');
    tagFiltersEl.hidden = recipeToolsEl.hidden || !tags.length;
    renderTagFilters(tags);

    var q = recipeQuery.trim().toLowerCase();
    var shown = ids.filter(function (id) {
      var r = recipes[id];
      return (!favoritesOnly || r.favorite) && (!tagFilter || hasTag(r, tagFilter)) && recipeMatches(r, q);
    });
    recipeListEl.hidden = !shown.length;
    recipeNoMatchEl.hidden = !all.length || !!shown.length;
    if (!shown.length && all.length) {
      recipeNoMatchEl.textContent = q ? 'No recipes match “' + recipeQuery.trim() + '”.'
        : tagFilter ? 'No ' + (favoritesOnly ? 'favorites' : 'recipes') + ' tagged “' + tagFilter + '”.'
        : 'No favorites yet — tap the star on a recipe.';
    }

    var planned = all.filter(function (id) { return id in week.items; }).length;
    planSummaryEl.innerHTML = all.length
      ? (planned ? '<strong>' + planned + '</strong> of ' + all.length + ' planned this week' : 'Tap a recipe to plan it for this week')
      : '';
    newWeekBtn.hidden = !(planned || week.extras.length || Object.keys(week.checked).length);

    var unplanned = all.length - planned;
    quickActionsEl.hidden = !all.length;
    planForMeBtn.hidden = unplanned < 1 || all.length < 2;
    renderWeekStrip();
    reconcileList(recipeListEl, shown, function (id) { return id; }, recipeCardHtml, updateRecipeCardEl);
  }

  function toggleFavorite(id) {
    var r = recipes[id];
    if (!r) return;
    var copy = JSON.parse(JSON.stringify(r));
    copy.favorite = !r.favorite;
    saveRecipeRecord(id, copy);
  }

  function editIconSvg() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  }

  function computeShoppingList() {
    var totals = {};
    comboParts = {};
    Object.keys(week.items).forEach(function (recipeId) {
      var recipe = recipes[recipeId];
      if (!recipe) return;
      var scale = week.items[recipeId] / (recipe.baseServings || 1);
      (recipe.ingredients || []).forEach(function (ing) {
        if (!ing.name) return;
        var unit = (ing.unit || '').trim();
        var key = ing.name.trim().toLowerCase() + '|' + unit.toLowerCase();
        var amt = (parseFloat(ing.amount) || 0) * scale;
        if (!totals[key]) totals[key] = { key: key, name: ing.name.trim(), unit: unit, amount: 0 };
        totals[key].amount += amt;
        var part = recipeId + PART_SEP + key;
        var list = comboParts[key] || (comboParts[key] = []);
        if (list.indexOf(part) === -1) list.push(part);
      });
    });
    return Object.keys(totals)
      .map(function (k) { return totals[k]; })
      .sort(function (a, b) { return a.name.localeCompare(b.name); });
  }

  function shopItemHtml(it) {
    var checked = isChecked(it);
    var trailingHtml = it.amount > 0
      ? '<span class="shop-amount" data-src="' + escapeHtml(shopAmountHtml(it)) + '">' + shopAmountHtml(it) + '</span>'
      : (it.unit ? '<span class="descriptor-tag">' + escapeHtml(it.unit) + '</span>' : '<span class="shop-amount"></span>');
    return (
      '<li class="shop-item' + (checked ? ' is-checked' : '') + '">' +
        '<label>' +
          '<input type="checkbox" data-key="' + escapeHtml(it.key) + '"' + (checked ? ' checked' : '') + '>' +
          trailingHtml +
          '<span class="shop-name"><span class="shop-name-text">' + escapeHtml(it.name) + '</span></span>' +
        '</label>' +
        '<button type="button" class="row-action" data-pantry="' + escapeHtml(pantryKey(it.name)) + '" data-name="' + escapeHtml(it.name) + '" aria-label="Already have ' + escapeHtml(it.name) + ' — move to pantry" title="Already have it">' + ICONS.jar + '</button>' +
      '</li>'
    );
  }

  function extraItemHtml(it) {
    var checked = isChecked(it);
    return (
      '<li class="shop-item is-extra' + (checked ? ' is-checked' : '') + '">' +
        '<label>' +
          '<input type="checkbox" data-key="' + escapeHtml(it.key) + '"' + (checked ? ' checked' : '') + '>' +
          '<span class="shop-name"><span class="shop-name-text">' + escapeHtml(it.name) + '</span></span>' +
        '</label>' +
        '<button type="button" class="row-action repeat-btn" data-repeat-extra="' + escapeHtml(it.id) + '" aria-pressed="' + (it.every ? 'true' : 'false') + '" aria-label="Add ' + escapeHtml(it.name) + ' every week" title="Every week">' + ICONS.repeat + '</button>' +
        '<button type="button" class="row-action" data-remove-extra="' + escapeHtml(it.id) + '" aria-label="Remove ' + escapeHtml(it.name) + '" title="Remove">' + ICONS.cross + '</button>' +
      '</li>'
    );
  }

  function updateExtraItemEl(el, it) {
    var checked = isChecked(it);
    el.classList.toggle('is-checked', checked);
    var checkbox = el.querySelector('input[type="checkbox"]');
    if (checkbox && checkbox.checked !== checked) checkbox.checked = checked;
    var nameEl = el.querySelector('.shop-name-text');
    if (nameEl && nameEl.textContent !== it.name) nameEl.textContent = it.name;
    var rep = el.querySelector('.repeat-btn');
    if (rep) rep.setAttribute('aria-pressed', it.every ? 'true' : 'false');
  }

  function rowHtml(it) { return it.kind === 'extra' ? extraItemHtml(it) : shopItemHtml(it); }
  function rowUpdate(el, it) { return it.kind === 'extra' ? updateExtraItemEl(el, it) : updateShopItemEl(el, it); }
  function rowKey(it) { return it.key; }

  function updateShopItemEl(el, it) {
    var checked = isChecked(it);
    el.classList.toggle('is-checked', checked);

    // Patch the checkbox in place — recreating it would replay its "checked" pop
    // animation on every unrelated row whenever the list re-renders.
    var checkbox = el.querySelector('input[type="checkbox"]');
    if (checkbox && checkbox.checked !== checked) checkbox.checked = checked;

    var nameEl = el.querySelector('.shop-name-text');
    if (nameEl && nameEl.textContent !== it.name) nameEl.textContent = it.name;

    var trailing = el.querySelector('.shop-amount, .descriptor-tag');
    var wantsAmount = it.amount > 0;
    var wantsTag = !wantsAmount && !!it.unit;
    var trailingIsAmount = trailing && trailing.classList.contains('shop-amount');
    var trailingIsTag = trailing && trailing.classList.contains('descriptor-tag');

    if ((wantsAmount && trailingIsAmount) || (!wantsAmount && !wantsTag && trailingIsAmount)) {
      var amtHtml = wantsAmount ? shopAmountHtml(it) : '';
      if (trailing.getAttribute('data-src') !== amtHtml) { trailing.setAttribute('data-src', amtHtml); trailing.innerHTML = amtHtml; }
    } else if (wantsTag && trailingIsTag) {
      trailing.textContent = it.unit;
    } else {
      // The trailing element's type itself changed (measured <-> unmeasured) — rare, since
      // that only happens if an ingredient's amount crosses zero, not from a plain toggle.
      var wrapper = document.createElement('div');
      wrapper.innerHTML = shopItemHtml(it);
      var fresh = wrapper.firstElementChild;
      if (fresh) { el.className = fresh.className; el.innerHTML = fresh.innerHTML; }
    }
  }

  function measuredUnmeasuredHtml(items) {
    var measured = items.filter(function (i) { return i.amount > 0; });
    var unmeasured = items.filter(function (i) { return i.amount <= 0; });
    var html = '<ul class="shopping-list">' + (measured.length
      ? measured.map(shopItemHtml).join('')
      : '<li class="empty-state">Nothing with an exact amount yet.</li>') + '</ul>';
    if (unmeasured.length) {
      html += '<div class="shopping-extras"><div class="ingredients-label">No exact amount</div><ul class="shopping-list">' + unmeasured.map(shopItemHtml).join('') + '</ul></div>';
    }
    return html;
  }

  function computeShoppingByRecipe() {
    var ids = Object.keys(week.items).filter(function (id) { return recipes[id]; }).sort(byDayThenName);
    return ids.map(function (id) {
      var recipe = recipes[id];
      var servings = week.items[id];
      var scale = servings / (recipe.baseServings || 1);
      var totals = {};
      (recipe.ingredients || []).forEach(function (ing) {
        if (!ing.name) return;
        var unit = (ing.unit || '').trim();
        var key = ing.name.trim().toLowerCase() + '|' + unit.toLowerCase();
        var amt = (parseFloat(ing.amount) || 0) * scale;
        if (!totals[key]) totals[key] = { key: id + PART_SEP + key, combo: key, name: ing.name.trim(), unit: unit, amount: 0 };
        totals[key].amount += amt;
      });
      var items = Object.keys(totals).map(function (k) { return totals[k]; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      return { id: id, name: recipe.name, servings: servings, day: dayOf(id), items: items };
    });
  }

  function groupMetaText(g) {
    return (g.day >= 0 ? DAY_SHORT[g.day] + ' · ' : '') + g.servings + ' serving' + (g.servings === 1 ? '' : 's');
  }

  function shoppingGroupHtml(g) {
    return (
      '<div class="recipe-shop-group">' +

          '<span class="recipe-shop-title"><span class="hue-dot" style="--hue:' + recipeHue(g.id) + '"></span><span class="recipe-shop-name">' + escapeHtml(g.name) + '</span></span>' +
          '<span class="recipe-shop-meta">' + escapeHtml(groupMetaText(g)) + '</span>' +
        '</div>' +
        measuredUnmeasuredHtml(g.items) +
      '</div>'
    );
  }

  function updateShoppingGroupEl(el, g) {
    var nameEl = el.querySelector('.recipe-shop-name');

    if (metaEl) metaEl.textContent = groupMetaText(g);

    var measured = sinkSort(g.items.filter(function (i) { return i.amount > 0; }));
    var unmeasured = sinkSort(g.items.filter(function (i) { return i.amount <= 0; }));

    var mainUl = el.querySelector(':scope > ul.shopping-list');

    if (unmeasured.length) {
      if (!extrasWrap) {
        el.insertAdjacentHTML('beforeend', '<div class="shopping-extras"><div class="ingredients-label">No exact amount</div><ul class="shopping-list"></ul></div>');
        extrasWrap = el.querySelector('.shopping-extras');
      }
      reconcileList(extrasWrap.querySelector('ul.shopping-list'), unmeasured, rowKey, shopItemHtml, updateShopItemEl);
    } else if (extrasWrap) {

    }
  }

  var EMPTY_PLAN_HTML = '<span class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18l-1.6 8.2A2 2 0 0 1 17.4 20H6.6a2 2 0 0 1-2-1.8z"/><path d="M8 10l3-6M16 10l-3-6"/><path d="M9.5 14v2.5M14.5 14v2.5"/></svg></span>' +

    pantry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v3H8z"/><path d="M7 6h10a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1z"/><path d="M6 11h12"/></svg>',
    spices: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l1 4H8z"/><path d="M8 7h8v12a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z"/><path d="M11 4.8h.01M13 4.8h.01"/></svg>',
    other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 8h13l-1 12.5h-11z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>'
  };

  // Roughly the order you walk a grocery store in.
  var AISLES = [
    { id: 'produce', label: 'Produce' },
    { id: 'bakery', label: 'Bakery' },
    { id: 'meat', label: 'Meat & seafood' },
    { id: 'dairy', label: 'Dairy & eggs' },
    { id: 'frozen', label: 'Frozen' },
    { id: 'pantry', label: 'Pantry' },
    { id: 'spices', label: 'Spices & seasonings' },
    { id: 'other', label: 'Other' }
  ];
  // First match wins, so the specific phrases that would otherwise be mis-filed come first
  // ("coconut milk" isn't dairy, "black pepper" isn't produce, "garlic powder" isn't produce).
  var AISLE_RULES = [
    ['frozen', /\bfrozen\b|\bice cream/],
    ['spices', /\b(garlic|onion|ginger|chil(?:i|li|e)|mustard) (powder|granules|flakes?)\b/],
    ['pantry', /\b(coconut (milk|cream)|peanut butter|almond butter|tomato (paste|sauce|puree|passata)|crushed tomato|diced tomato|canned|stock|broth|bouillon|evaporated milk|condensed milk|fish sauce|soy sauce|oyster sauce|hoisin|sriracha|hot sauce|chil(?:i|li|e) sauce|curry paste|tamarind|bread ?crumbs?|panko|chocolate chips?|cream of tartar|corn ?(starch|flour|meal|syrup))/],
    ['produce', /\b(garlic|bell peppers?|jalape|serrano|poblano|habanero|chil(?:i|li|e) peppers?|red peppers?(?! flake)|green peppers?|fresh (ginger|herbs?|thyme|rosemary|basil|oregano|dill|mint|sage))/],
    ['spices', /^(salt and )?pepper$|\b(salt|(black|white|ground|cracked) pepper|peppercorns?|pepper flakes?|cayenne|paprika|cumin|ground coriander|coriander seeds?|turmeric|cinnamon|nutmeg|cloves?\b|cardamom|allspice|garam masala|curry powder|five[- ]spice|oregano|bay lea|italian seasoning|seasoning|spice|vanilla|saffron|star anise|fennel seeds?|mustard seeds?|sesame seeds?|thyme|rosemary|dried)/],
    ['meat', /\b(chicken|beef|pork|lamb|turkey|bacon|sausage|ham\b|steak|mince|veal|duck|chorizo|prosciutto|pancetta|salami|pepperoni|fish|salmon|tuna|cod\b|tilapia|halibut|shrimp|prawns?|crab|lobster|scallops?|mussels?|clams?|oysters?|anchov|sardines?|squid|thighs?|breasts?|drumsticks?|wings?|ribs?\b)/],
    ['dairy', /\b(milk|butter(?!nut)|buttermilk|cream|cheese|parmesan|parmigiano|mozzarella|cheddar|feta|ricotta|mascarpone|gruy[eè]re|brie|yog(?:h)?urt|eggs?\b|ghee|half[- ]and[- ]half|cr[eè]me fra[iî]che)/],
    ['bakery', /\b(bread|baguette|buns?\b|rolls?\b(?! oats)|tortillas?|pitas?\b|naan|bagels?|croissants?|brioche|sourdough|flatbread|wraps?\b)/],
    ['produce', /\b(apple|apricot|arugula|asparagus|avocado|banana|basil|bean sprout|beets?\b|berr|bok choy|broccoli|brussels|cabbage|carrot|cauliflower|celery|chard|cherr|chives?|cilantro|coriander|corn\b|cucumber|dill|eggplant|fennel|figs?\b|grapes?\b|green beans?|green onions?|herbs?\b|kale|leeks?|lemon|lettuce|lime|mango|melon|mint|mushroom|nectarine|okra|onion|orange|parsley|parsnip|peas?\b|peach|pears?\b|pepper|pineapple|plums?\b|potato|pumpkin|radish|sage\b|scallion|shallot|spinach|sprouts?|squash|tomato|turnip|yams?\b|zucchini|lemongrass|galangal|shiitake|salad|greens\b|fruit|vegetable|veggie)/],
    ['pantry', /\b(flour|sugar|rice|pasta|spaghetti|penne|macaroni|noodles?|lasagn|oil\b|vinegar|sauce|syrup|honey|oats?\b|lentils?|chickpeas?|beans?\b|quinoa|couscous|barley|baking|yeast|cocoa|chocolate|nuts?\b|almonds?|walnuts?|pecans?|cashews?|pistachios?|peanuts?|raisins?|jam\b|jelly|mustard|ketchup|mayo|tahini|miso|paste\b|tapioca|cereal|crackers?|chips?\b|coconut|gelatin|extract|wine|beer|juice|coffee|tea\b)/]
  ];
  var PANTRY_UNITS = /^(can|cans|jar|jars|packet|packets|box|boxes|bag|bags|tin|tins)$/;

  function aisleOf(it) {
    var n = pantryKey(it.name);
    for (var i = 0; i < AISLE_RULES.length; i++) if (AISLE_RULES[i][1].test(n)) return AISLE_RULES[i][0];
    if (PANTRY_UNITS.test(String(it.unit || '').trim().toLowerCase())) return 'pantry';
    return 'other';
  }

  function shoppingState() {
    var all = computeShoppingList();
    var active = [], pantried = [];
    all.forEach(function (it) { (week.pantry[pantryKey(it.name)] ? pantried : active).push(it); });
    var extras = week.extras.map(function (x) { return { kind: 'extra', key: 'x:' + x.id, id: x.id, name: x.name, every: !!x.every }; });
    var countable = active.concat(extras);
    var checked = countable.filter(function (it) { return isChecked(it); }).length;
    return { all: all, active: active, pantried: pantried, extras: extras, total: countable.length, checked: checked };
  }

  function sectionHtml(sec) {
    return (
      '<div class="recipe-shop-group shop-section">' +
        '<div class="recipe-shop-head">' +
          '<span class="recipe-shop-title"><span class="section-icon" aria-hidden="true">' + sec.icon + '</span><span class="section-name">' + escapeHtml(sec.label) + '</span></span>' +
          '<span class="section-meta"></span>' +
        '</div>' +
        '<ul class="shopping-list"></ul>' +
      '</div>'
    );
  }

  function updateSectionEl(el, sec) {
    var nameEl = el.querySelector('.section-name');
    if (nameEl && nameEl.textContent !== sec.label) nameEl.textContent = sec.label;
    var left = sec.items.filter(function (it) { return !isChecked(it); }).length;
    var metaEl = el.querySelector('.section-meta');
    if (metaEl) metaEl.textContent = left ? left + ' left' : 'Done';
    el.classList.toggle('is-done', !left);
    reconcileList(el.querySelector('ul.shopping-list'), sinkSort(sec.items), rowKey, rowHtml, rowUpdate);
  }

  function extrasSection(extras) {
    return { kind: 'section', id: 'extras', label: 'Your items', icon: ICONS.list, items: extras };
  }

  function renderPantrySection(pantried) {
    var seen = {};
    var rows = [];
    pantried.forEach(function (it) {
      var k = pantryKey(it.name);
      if (!seen[k]) { seen[k] = true; rows.push({ key: k, name: it.name }); }
    });
    pantrySectionEl.hidden = !rows.length;
    if (!rows.length) return;
    pantrySummaryEl.textContent = 'In your pantry · ' + rows.length;
    pantryListEl.innerHTML = rows.map(function (r) {
      return '<li><span>' + escapeHtml(r.name) + '</span><button type="button" class="btn-text" data-unpantry="' + escapeHtml(r.key) + '">Need it</button></li>';
    }).join('');
  }

  function renderShopping() {
    // No need to touch a display:none subtree on every recipe/servings change — it gets a
    // fresh render when the Shopping List tab is actually switched to (see setActiveTab).
    if (panelShopEl.hidden) return;

    var st = shoppingState();
    var hasContent = st.all.length > 0 || st.extras.length > 0;
    shoppingCombinedEl.hidden = !hasContent || shoppingView !== 'combined';
    shoppingByRecipeEl.hidden = !hasContent || shoppingView !== 'recipe';
    shopEmptyEl.hidden = hasContent;
    shopSummaryEl.hidden = !st.total;
    shopToolbarEl.hidden = !hasContent;
    clearCheckedBtn.hidden = st.checked === 0;
    renderPantrySection(st.pantried);

    if (!hasContent) {
      itemCountEl.textContent = '';
      if (!shopEmptyEl.innerHTML) shopEmptyEl.innerHTML = EMPTY_PLAN_HTML;
      return;
    }

    if (st.total) {
      itemCountEl.textContent = st.checked + ' of ' + st.total;
      progressFillEl.style.width = (st.checked / st.total * 100) + '%';
      var complete = st.checked === st.total;
      shopSummaryTextEl.textContent = complete ? 'checked off — you’re all set' : 'checked off';
      shopSummaryEl.classList.toggle('is-complete', complete);
      if (complete && lastShopComplete === false) markTransient(shopSummaryEl, 'celebrate');
      lastShopComplete = complete;
      renderCostChip(st);
    }

    if (shoppingView === 'combined') {
      var sections = [];
      if (st.extras.length) sections.push(extrasSection(st.extras));
      AISLES.forEach(function (a) {
        var its = st.active.filter(function (it) { return aisleOf(it) === a.id; });
        if (!its.length) return;
        // Measured items first, then the "to taste" ones, so the two never interleave.
        its = its.filter(function (it) { return it.amount > 0; }).concat(its.filter(function (it) { return it.amount <= 0; }));
        sections.push({ kind: 'section', id: 'aisle:' + a.id, label: a.label, icon: ICONS[a.id], items: its });
      });
      reconcileList(shoppingCombinedEl, sections, function (sec) { return sec.id; }, sectionHtml, updateSectionEl);
    } else {
      var groups = st.extras.length ? [extrasSection(st.extras)] : [];
      computeShoppingByRecipe().forEach(function (g) {
        var active = g.items.filter(function (it) { return !week.pantry[pantryKey(it.name)]; });
        groups.push({ kind: 'recipe', id: g.id, name: g.name, servings: g.servings, day: g.day, items: active, allPantry: g.items.length > 0 && !active.length });
      });
      reconcileList(shoppingByRecipeEl, groups, function (g) { return g.id; },
        function (g) { return g.kind === 'section' ? sectionHtml(g) : shoppingGroupHtml(g); },
        function (el, g) { return g.kind === 'section' ? updateSectionEl(el, g) : updateShoppingGroupEl(el, g); });
    }
  }

  // ---------- Sharing ----------

  function shareText() {
    var st = shoppingState();
    var lines = ['Shopping list'];
    function add(label, items) {
      var open = items.filter(function (it) { return !isChecked(it); });
      if (!open.length) return;
      lines.push('', label);
      open.forEach(function (it) {
        if (it.kind === 'extra') { lines.push('• ' + it.name); return; }
        var amt = it.amount > 0 ? formatIngredientPlain(buyAmount(it) || it.amount, it.unit) : '';
        lines.push('• ' + (amt ? amt + ' ' + it.name : it.name + (it.unit ? ' (' + it.unit + ')' : '')));
      });
    }
    if (st.extras.length) add('Your items', st.extras);
    if (shoppingView === 'combined') {
      AISLES.forEach(function (a) { add(a.label, st.active.filter(function (it) { return aisleOf(it) === a.id; })); });
    } else {
      computeShoppingByRecipe().forEach(function (g) {
        add(g.name, g.items.filter(function (it) { return !week.pantry[pantryKey(it.name)]; }));
      });
    }
    if (lines.length === 1) lines.push('', 'Everything’s checked off.');
    return lines.join('\n');
  }

  function shareList() {
    var text = shareText();
    if (navigator.share) {
      navigator.share({ title: 'Shopping list', text: text }).catch(function (e) {
        if (e && e.name === 'AbortError') return; // the viewer closed the share sheet
        copyText(text);
      });
      return;
    }
    copyText(text);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('Shopping list copied'); }, function () { openShareSheet(text); });
    } else {
      openShareSheet(text);
    }
  }

  // Fallback when this page isn't allowed to share or write to the clipboard directly.
  function openShareSheet(text) {
    modalState.shareText = text;
    openModal('share', { origin: 'share' });
  }

  // ---------- Share & print a recipe ----------

  function recipeShareServings(id) { return week.items[id] || recipes[id].baseServings || 1; }

  function recipeText(id) {
    var r = recipes[id];
    var servings = recipeShareServings(id);
    var scale = servings / (r.baseServings || 1);
    var lines = [r.name];
    var meta = ['Serves ' + servings];
    if (minutesOf(r.prepMin)) meta.push('Prep ' + formatMinutes(minutesOf(r.prepMin)));
    if (minutesOf(r.cookMin)) meta.push('Cook ' + formatMinutes(minutesOf(r.cookMin)));
    lines.push(meta.join(' · '));
    lines.push('', 'Ingredients');
    (r.ingredients || []).forEach(function (ing) {
      if (!ing || !ing.name) return;
      var amt = (parseFloat(ing.amount) || 0) * scale;
      lines.push('• ' + (amt > 0 ? formatIngredientPlain(amt, ing.unit) + ' ' + ing.name : ing.name + (ing.unit ? ' (' + ing.unit + ')' : '')));
    });
    var steps = alongSteps(id);
    if (steps.length) {
      lines.push('', 'Directions');
      steps.forEach(function (t, i) { lines.push((i + 1) + '. ' + t); });
    }
    if ((r.notes || '').trim()) lines.push('', 'Notes', r.notes.trim());
    if (r.sourceUrl) lines.push('', 'Source: ' + r.sourceUrl);
    return lines.join('\n');
  }

  function openRecipeShare(id) {
    if (!recipes[id]) return;
    modalState.shareId = id;
    modalState.shareText = recipeText(id);
    modalState.shareTitle = recipes[id].name;
    modalState.copiedLabel = 'Recipe copied';
    openModal('recipe-share', { origin: 'share' });
  }

  var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>';
  var PRINT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v6H7z"/></svg>';
  var SAVE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19h14"/></svg>';

  function recipeShareHtml() {
    var servings = recipeShareServings(modalState.shareId);
    return '<p class="paste-tip">Amounts are for ' + servings + ' serving' + (servings === 1 ? '' : 's') + (modalState.shareId in week.items ? ', as planned this week' : '') + '.</p>' +
      '<textarea id="shareText" class="form-textarea share-text" readonly>' + escapeHtml(modalState.shareText || '') + '</textarea>' +
      '<div class="share-actions">' +
        '<button type="button" class="btn btn-accent" data-action="copy-share">' + COPY_SVG + 'Copy</button>' +
        (navigator.share ? '<button type="button" class="btn btn-outline" data-action="native-share">' + ICONS.share + 'Share…</button>' : '') +
        '<button type="button" class="btn btn-outline" data-action="print-recipe">' + PRINT_SVG + 'Print</button>' +
        (downloadsApi ? '<button type="button" class="btn btn-outline" data-action="save-recipe-file">' + SAVE_SVG + 'Save as file</button>' : '') +
      '</div>' +
      '<div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Close</button></div>';
  }

  // A clean, printable card for one recipe (also the body of the saved .html file).
  function recipeCardDocHtml(id) {
    var r = recipes[id];
    var servings = recipeShareServings(id);
    var scale = servings / (r.baseServings || 1);
    var meta = ['Serves ' + servings];
    if (minutesOf(r.prepMin)) meta.push('Prep ' + formatMinutes(minutesOf(r.prepMin)));
    if (minutesOf(r.cookMin)) meta.push('Cook ' + formatMinutes(minutesOf(r.cookMin)));
    var ings = (r.ingredients || []).filter(function (i) { return i && i.name; }).map(function (ing) {
      var amt = (parseFloat(ing.amount) || 0) * scale;
      return '<li>' + (amt > 0 ? '<strong>' + escapeHtml(formatIngredientPlain(amt, ing.unit)) + '</strong> ' : '') + escapeHtml(ing.name) + (amt > 0 || !ing.unit ? '' : ' <em>(' + escapeHtml(ing.unit) + ')</em>') + '</li>';
    }).join('');
    var steps = alongSteps(id).map(function (t) { return '<li>' + escapeHtml(t) + '</li>'; }).join('');
    return '<h1>' + escapeHtml(r.name) + '</h1><p class="pc-meta">' + escapeHtml(meta.join(' · ')) + '</p>' +
      '<h2>Ingredients</h2><ul>' + ings + '</ul>' +
      (steps ? '<h2>Directions</h2><ol>' + steps + '</ol>' : '') +
      ((r.notes || '').trim() ? '<h2>Notes</h2><p style="white-space:pre-wrap">' + escapeHtml(r.notes.trim()) + '</p>' : '') +
      (r.sourceUrl ? '<p class="pc-meta" style="margin-top:16pt">Source: ' + escapeHtml(r.sourceUrl) + '</p>' : '');
  }

  function printRecipe(id) {
    if (!recipes[id]) return;
    var card = document.getElementById('printCard');
    card.innerHTML = recipeCardDocHtml(id);
    document.documentElement.classList.add('printing');
    var done = function () { document.documentElement.classList.remove('printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    try { window.print(); } catch (e) { done(); }
    setTimeout(done, 60000);
  }

  function slugFor(name) { return String(name || 'recipe').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'recipe'; }

  function saveFile(filename, data, okMessage) {
    if (!downloadsApi) return;
    downloadsApi.save({ filename: filename, data: data }).then(function () { showToast(okMessage); }, function (err) {
      if (err && (err.code === 'declined' || err.code === 'rate_limited')) return;
      showToast('Couldn’t save the file here — use Copy instead');
    });
  }

  function saveRecipeFile(id) {
    if (!recipes[id]) return;
    var doc = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + escapeHtml(recipes[id].name) + '</title>' +
      '<style>body{max-width:680px;margin:40px auto;padding:0 20px;font:17px/1.6 Georgia,serif;color:#16191B}h1{font-size:2em;margin:0 0 4px;line-height:1.15}h2{font-size:1.15em;margin:28px 0 8px;padding-bottom:4px;border-bottom:1px solid #ddd}.pc-meta{color:#555;margin:0}li{margin:4px 0}strong{font-weight:600}</style></head><body>' +
      recipeCardDocHtml(id) + '</body></html>';
    saveFile(slugFor(recipes[id].name) + '.html', doc, 'Recipe saved');
  }

  // ---------- Back up & restore ----------

  function backupJson() {
    return JSON.stringify({ app: 'Sous Chef', kind: 'recipes', version: 1, exportedAt: new Date().toISOString(), recipes: recipes }, null, 1);
  }

  function openBackup() {
    modalState.restoreError = '';
    modalState.copiedLabel = 'Backup copied';
    openModal('backup', { origin: 'backup' });
  }

  function backupHtml() {
    var count = Object.keys(recipes).length;
    return '<p class="paste-tip" style="margin-top:0">' + (count
        ? 'Your ' + count + ' recipe' + (count === 1 ? '' : 's') + ' as one block of text. Keep a copy somewhere safe, or restore it into Sous Chef on another device.'
        : 'No recipes to back up yet — but you can restore a backup below.') + '</p>' +
      (count ? '<div class="share-actions">' +
        '<button type="button" class="btn btn-accent" data-action="copy-backup">' + COPY_SVG + 'Copy backup</button>' +
        (downloadsApi ? '<button type="button" class="btn btn-outline" data-action="save-backup">' + SAVE_SVG + 'Save as file</button>' : '') +
      '</div>' : '') +
      '<div class="paste-divider"><span>Restore</span></div>' +
      '<textarea id="restoreText" class="form-textarea restore-text" placeholder="Paste a backup here" spellcheck="false"></textarea>' +
      '<div class="restore-row"><button type="button" class="btn-text btn-small" data-action="restore-file">Or choose a backup file…</button>' +
        '<input type="file" id="restoreFile" accept=".json,application/json,text/plain" hidden></div>' +
      '<div class="form-error" id="restoreError">' + escapeHtml(modalState.restoreError || '') + '</div>' +
      '<p class="paste-tip">Restoring adds the recipes in the backup. Ones you already have are replaced by the backup’s version — you can undo right after.</p>' +
      '<div class="form-actions">' +
        '<button type="button" class="btn btn-outline" data-action="close-modal">Close</button>' +
        '<button type="button" class="btn btn-accent" data-action="do-restore">Restore</button>' +
      '</div>';
  }

  function copyBackup() {
    var text = backupJson();
    var fallback = function () {
      modalState.shareText = text;
      modalState.copiedLabel = 'Backup copied';
      openModal('share', { origin: 'share' });
      modalTitleEl.textContent = 'Backup';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { showToast('Backup copied — paste it somewhere safe'); }, fallback);
    } else fallback();
  }

  function saveBackupFile() {
    var d = new Date();
    var stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    saveFile('sous-chef-recipes-' + stamp + '.json', backupJson(), 'Backup saved');
  }

  // Everything from a backup (or another device) is checked and trimmed before it's kept.
  function sanitizeRecipe(r) {
    if (!r || typeof r !== 'object') return null;
    var name = String(r.name == null ? '' : r.name).trim().slice(0, 120);
    if (!name) return null;
    var ings = (Array.isArray(r.ingredients) ? r.ingredients : []).slice(0, 80).map(function (i) {
      i = i && typeof i === 'object' ? i : {};
      return { amount: Math.max(0, parseFloat(i.amount) || 0), unit: String(i.unit == null ? '' : i.unit).slice(0, 24), name: String(i.name == null ? '' : i.name).trim().slice(0, 80) };
    }).filter(function (i) { return i.name; });
    if (!ings.length) return null;
    var clean = {
      name: name,

  // ---------- Timers ----------

  var timers = {};

      [[0, 880], [0.2, 1175], [0.4, 1568]].forEach(function (n) {
        var o = audioCtx.createOscillator();
        var g = audioCtx.createGain();
        o.type = 'sine';
        o.frequency.value = n[1];
        g.gain.setValueAtTime(0.0001, t0 + n[0]);
        g.gain.exponentialRampToValueAtTime(0.25, t0 + n[0] + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + n[0] + 0.6);

  var PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>';

  }

    if (!('wakeLock' in navigator)) return;

        wakeRequesting = false;
        wakeLock = lock;
        lock.addEventListener('release', function () { wakeLock = null; renderWakeNote(); });
        if (!wantWakeLock()) { lock.release(); wakeLock = null; }
        renderWakeNote();
      }, function () { wakeRequesting = false; renderWakeNote(); }); // not allowed here — just go without
    } else if (!wantWakeLock() && wakeLock) {
      wakeLock.release();
      wakeLock = null;
    }
    renderWakeNote();

  function todayCardRowHtml(id) {

  var PLAY_SMALL_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>';

  }

  function renderTodayCard(ids) {

  // ---------- Cook-along: one step at a time, full screen ----------
  // Pages: 0 = get everything ready, 1..n = the steps, n+1 = done.

  var alongEl = document.getElementById('along');
  var alongStageEl = document.getElementById('alongStage');
  var alongKickerEl = document.getElementById('alongKicker');
  var alongTitleEl = document.getElementById('alongTitle');
  var alongProgressEl = document.getElementById('alongProgress');
  var alongNavEl = document.getElementById('alongNav');
  var alongPrevBtn = document.getElementById('alongPrev');
  var alongNextBtn = document.getElementById('alongNext');
  var alongSpeakBtn = document.getElementById('alongSpeak');
  var alongCloseBtn = document.getElementById('alongClose');
  var along = null; // { id, page } while open
  var alongOpener = null;

  try { readAloud = canSpeak && localStorage.getItem('sous_chef_read_aloud') === '1'; } catch (e) {}

  function alongSteps(id) {
    var r = recipes[id];

  }
  function alongIngredients(id) {
    var r = recipes[id];
    return (r && Array.isArray(r.ingredients) ? r.ingredients : []).filter(function (ing) { return ing && ing.name; });
  }
  function alongScale(id) {
    var r = recipes[id];

  }
  // Resume where you left off: the first step not yet done (or the start, if nothing's done).
  function alongStartPage(id) {
    var map = cookDone[id] || {};
    if (!Object.keys(map).length) return 0;
    var steps = alongSteps(id);
    for (var i = 0; i < steps.length; i++) if (!map[i]) return i + 1;

  }

  // Ingredients a step mentions ("Sear the chicken" -> 1.5 lb chicken thighs), so you needn't scroll back.
  var STEP_WORD_SKIP = { fresh: 1, ground: 1, large: 1, small: 1, medium: 1, chopped: 1, minced: 1, sliced: 1, diced: 1, whole: 1, dried: 1, extra: 1, virgin: 1, boneless: 1, skinless: 1, plain: 1, light: 1, dark: 1, cold: 1, warm: 1, room: 1, temperature: 1, finely: 1, roughly: 1, about: 1, divided: 1, optional: 1, taste: 1, packed: 1, cups: 1, cup: 1, and: 1, the: 1, for: 1, with: 1 };
  function ingredientsInStep(id, text) {
    var lower = ' ' + String(text).toLowerCase().replace(/[^a-z\s]/g, ' ') + ' ';
    return alongIngredients(id).filter(function (ing) {
      return String(ing.name).toLowerCase().replace(/[^a-z\s]/g, ' ').split(/\s+/).some(function (w) {

  }
  function amountHtml(ing, scale) {

  // Page markup leaves out what can change while it's open (ticks, rating); sync functions set those
  // in place, so a tick doesn't rebuild the page and replay its animations.
  function alongPrepHtml(id) {
    var r = recipes[id];
    var scale = alongScale(id);

    var ings = alongIngredients(id);
    var notes = (r.notes || '').trim();
    var heroSrc = recipePhotoSrc(id);
    return '<div class="along-page along-prep">' +
      (heroSrc ? '<img class="along-hero" alt="' + escapeHtml(r.name) + '" src="' + escapeHtml(heroSrc) + '">' : '') +
      '<h3 class="along-h">Get everything ready</h3>' +
      '<p class="along-sub">For ' + servings + ' serving' + (servings === 1 ? '' : 's') + (totalMinutes(r) ? ' · about ' + formatMinutes(totalMinutes(r)) : '') + ' · <span class="prep-count"></span></p>' +
      '<ul class="prep-list">' + ings.map(function (ing, i) {

  // Filled in by the AI helpers (ingredient swaps); nothing without them.
  function prepRowActionHtml(id, i) { return swapButtonHtml(alongIngredients(id)[i], i); }

  function syncAlongPrep(id) {
    var map = prepDone[id] || {};
    var items = alongStageEl.querySelectorAll('.prep-item');
    var ready = 0;
    items.forEach(function (li) {
      var on = !!map[li.getAttribute('data-prep')];

  function alongStepHtml(id, idx) {
    var steps = alongSteps(id);

  function alongFinishHtml(id) {

      '<svg class="finish-mark" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7.5 7.5L37.5 19"/></svg>' +
      '<h3 class="along-h">All done!</h3>' +
      '<p class="along-sub">' + escapeHtml(recipes[id].name) + ' is marked as cooked today.</p>' +

  function renderAlong(dir) {
    if (!along) return;
    var id = along.id;
    if (!recipes[id]) { closeAlong(); return; }
    var steps = alongSteps(id);
    var last = steps.length + 1;
    if (along.page > last) along.page = last;
    var page = along.page;

    alongTitleEl.textContent = recipes[id].name;
    alongKickerEl.textContent = page === 0 ? 'Get ready' : page === last ? 'Finished' : 'Step ' + page + ' of ' + steps.length;

    if (alongProgressEl.innerHTML !== segs) alongProgressEl.innerHTML = segs;

    var html = page === 0 ? alongPrepHtml(id) : page === last ? alongFinishHtml(id) : alongStepHtml(id, page - 1);
    var key = id + ':' + page;
    var current = alongStageEl.firstElementChild;
    var samePage = current && alongStageEl.getAttribute('data-page') === key;
    if (!samePage || alongStageEl.getAttribute('data-src') !== html) {
      alongStageEl.setAttribute('data-page', key);
      alongStageEl.setAttribute('data-src', html);

    alongNavEl.classList.toggle('solo', page === 0);
    alongNextBtn.textContent = page === last ? 'Done' : page === 0 ? (steps.length ? 'Start cooking' : 'Finish') : page === steps.length ? 'Finish' : 'Next step';

  function speakAlongPage() {
    if (!along || !readAloud || !canSpeak) return;
    var id = along.id, steps = alongSteps(id), page = along.page;
    var text = page === 0
      ? 'Get everything ready. ' + alongIngredients(id).map(function (ing) {
          var amt = (parseFloat(ing.amount) || 0) * alongScale(id);
          return (amt > 0 ? formatIngredientPlain(amt, ing.unit) + ' ' : '') + ing.name;
        }).join(', ') + '.'
      : page > steps.length ? 'All done. Nice cooking.'
      : 'Step ' + page + '. ' + steps[page - 1];

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(new window.SpeechSynthesisUtterance(text));
    } catch (e) {}
  }

  function openAlong(id) {
    if (!recipes[id]) return;
    alongOpener = document.activeElement;
    along = { id: id, page: alongStartPage(id) };
    alongStageEl.removeAttribute('data-page');
    alongEl.hidden = false;
    document.documentElement.classList.add('along-open');

  }

  function closeAlong() {
    if (!along) return;

    if (alongOpener && alongOpener.isConnected) alongOpener.focus();

  function goAlong(delta) {

    if (delta > 0 && along.page === last) { closeAlong(); return; }
    // Moving on from a step counts it as done (going back never un-does one).
    if (delta > 0 && along.page >= 1 && along.page <= steps.length) {
      (cookDone[id] || (cookDone[id] = {}))[along.page - 1] = true;
      persistCookDone();
    }
    var next = Math.max(0, Math.min(last, along.page + delta));
    if (next === along.page) return;
    along.page = next;
    renderAlong(delta);
    if (next === last) markCooked(id); // after the page change, so its entrance still plays
    speakAlongPage();
  }

  // Swipe left for the next step, right to go back — handy with messy hands.
  var swipe = null;

  });

  alongStageEl.addEventListener('pointercancel', function () { swipe = null; });

  // ---------- Plan for me ----------
  // Picks recipes for the open days, leaning toward favorites and high ratings and away from
  // anything cooked in the last week or two. Works without AI, so it's instant and always there.

  function planWeight(r) {
    var w = 1;
    if (r.favorite) w *= 2.5;
    var rating = ratingOf(r);
    if (rating) w *= 0.4 + rating * 0.3;
    var lc = lastCookedOf(r);
    if (!lc) w *= 1.2;
    else {
      var d = daysSince(lc);
      w *= d < 7 ? 0.15 : d < 14 ? 0.5 : d < 30 ? 1 : 1.4;
    }
    return w;
  }

  function planForMe() {
    var all = Object.keys(recipes);
    var pool = all.filter(function (id) { return !(id in week.items); });
    if (!pool.length) { showToast('Everything in your box is already planned'); return; }
    var planned = all.length - pool.length;
    var count = Math.min(pool.length, Math.max(1, Math.min(3, 5 - planned)));
    var picks = [];
    while (picks.length < count && pool.length) {
      var weights = pool.map(function (id) { return planWeight(recipes[id]); });
      var total = weights.reduce(function (a, b) { return a + b; }, 0);
      var roll = Math.random() * total, i = 0;
      while (i < pool.length - 1 && roll >= weights[i]) { roll -= weights[i]; i++; }
      picks.push(pool.splice(i, 1)[0]);
    }
    // Open days from today to Sunday first, then the start of next week.
    var t = todayIndex(), taken = {};
    Object.keys(week.days).forEach(function (id) { taken[week.days[id]] = true; });
    var open = [];
    for (var k = 0; k < 7; k++) { var d = (t + k) % 7; if (!taken[d]) open.push(d); }

    var w = cloneWeek(week);
    picks.forEach(function (id, j) {
      w.items[id] = recipes[id].baseServings || 1;
      if (j < open.length) w.days[id] = open[j];
    });
    saveWeekRecord(w);
    showToast('Planned ' + picks.length + ' recipe' + (picks.length === 1 ? '' : 's') + ': ' + picks.map(function (id) { return recipes[id].name; }).join(', '), function () {
      // Take back just these picks, keeping anything else changed in the meantime.
      var now = cloneWeek(week);
      picks.forEach(function (id) { delete now.items[id]; delete now.days[id]; delete now.leftovers[id]; });
      saveWeekRecord(now);
    });
  }

  // ---------- What can I make? ----------

  var STAPLE_RE = /^(salt|kosher salt|sea salt|pepper|black pepper|salt and pepper|water|oil|olive oil|vegetable oil|cooking spray|sugar|ice|crushed ice)$/;
  function haveTerms(text) {
    var seen = {};
    return String(text || '').toLowerCase().split(/[,;\n]+/).map(function (t) {
      return t.replace(/^\s*(some|a few|a bit of|half an?|an?|\d+([.,\/]\d+)?\s*(g|kg|lb|lbs|oz|cups?|cans?|tbsp|tsp)?)\s+/, '').trim();
    }).filter(function (t) { if (!t || seen[t]) return false; seen[t] = true; return true; }).slice(0, 60);
  }
  function hasIngredient(name, terms) {
    var n = ' ' + String(name).toLowerCase() + ' ';
    return terms.some(function (t) {
      if (n.indexOf(t) !== -1 || (t.length > 3 && t.indexOf(n.trim()) !== -1)) return true;
      return t.split(/\s+/).some(function (w) {
        if (w.length < 4 || STEP_WORD_SKIP[w]) return false;
        var stem = w.length > 4 ? w.replace(/(es|s)$/, '') : w;

  // ---------- Nutrition & cost (AI estimates) ----------

  // A fingerprint of what a nutrition estimate was based on, so editing the ingredients or
  // servings quietly retires the old numbers instead of showing wrong ones.
  function nutritionSig(r) {
    var str = (r.baseServings || 1) + '|' + (r.ingredients || []).map(function (i) { return i ? (i.amount || 0) + ' ' + (i.unit || '') + ' ' + (i.name || '') : ''; }).join(';');

  function cleanNutrition(nu) {

    var out = { calories: num(nu.calories, 5000), protein: num(nu.protein, 1000), carbs: num(nu.carbs, 1000), fat: num(nu.fat, 1000), sig: typeof nu.sig === 'string' ? nu.sig.slice(0, 16) : '' };

    return out;
  }
  function nutritionOf(r) {
    var nu = r && cleanNutrition(r.nutrition);
    return nu && nu.sig === nutritionSig(r) ? nu : null;
  }

  // Currency from the viewer's region, for cost estimates.
  var REGION_CURRENCY = { US: 'USD', CA: 'CAD', GB: 'GBP', AU: 'AUD', NZ: 'NZD', IN: 'INR', IE: 'EUR', DE: 'EUR', FR: 'EUR', ES: 'EUR', IT: 'EUR', NL: 'EUR', BE: 'EUR', AT: 'EUR', PT: 'EUR', FI: 'EUR', GR: 'EUR', JP: 'JPY', MX: 'MXN', BR: 'BRL', ZA: 'ZAR', SG: 'SGD', PH: 'PHP', SE: 'SEK', NO: 'NOK', DK: 'DKK', CH: 'CHF', KR: 'KRW', HK: 'HKD' };
  var viewerLocale = (navigator.language || 'en-US');
  var viewerRegion = (viewerLocale.split('-')[1] || 'US').toUpperCase();
  var viewerCurrency = REGION_CURRENCY[viewerRegion] || 'USD';
  function formatMoney(v, currency) {
    try { return new Intl.NumberFormat(viewerLocale, { style: 'currency', currency: currency || viewerCurrency, maximumFractionDigits: v >= 100 ? 0 : 2 }).format(v); }
    catch (e) { return (currency || viewerCurrency) + ' ' + v.toFixed(2); }
  }

  // Item prices are kept on this device, keyed by item, with the amount they were priced at —
  // so the total follows the list as servings change, and new items show as not yet priced.
  var priceBook = {};
  try { priceBook = JSON.parse(localStorage.getItem('sous_chef_prices') || '{}') || {}; } catch (e) { priceBook = {}; }
  if (!priceBook.items || typeof priceBook.items !== 'object') priceBook = { currency: viewerCurrency, items: {} };
  function persistPriceBook() { try { localStorage.setItem('sous_chef_prices', JSON.stringify(priceBook)); } catch (e) {} }

  function costItems() {
    var st = shoppingState();
    return st.active.map(function (it) {
      return { key: 'i:' + it.key, label: (it.amount > 0 ? formatIngredientPlain(buyAmount(it) || it.amount, it.unit) + ' ' : '') + it.name, amount: buyAmount(it) || it.amount || 1, item: it };
    }).concat(st.extras.map(function (x) { return { key: 'x:' + x.name.trim().toLowerCase(), label: x.name, amount: 1, item: x }; }));
  }
  function priceFor(ci) {
    var p = priceBook.items[ci.key];
    if (!p || !(p.price >= 0)) return null;
    return p.amount > 0 ? p.price * (ci.amount / p.amount) : p.price;
  }
  function costSummary() {
    var items = costItems();
    var total = 0, priced = 0;
    items.forEach(function (ci) { var v = priceFor(ci); if (v !== null) { total += v; priced++; } });
    return { items: items, total: total, priced: priced, missing: items.length - priced };
  }

  var costChipEl = document.getElementById('costChip');
  function renderCostChip() {
    var c = costSummary();

    if (costChipEl.textContent !== txt) costChipEl.textContent = txt;

  }

      var n = modalState.nut;

        var lines = c.items.map(function (ci) { return [ci, priceFor(ci)]; }).filter(function (x) { return x[1] !== null; })
          .sort(function (a, b) { return b[1] - a[1]; }).slice(0, 6);
        html += '<ul class="cost-lines">' + lines.map(function (x) {

        (cs.loading ? 'Pricing…' : c.missing ? 'Estimate cost' : 'Estimate again') + '</button></div>';
      if (cs.error) html += '<div class="form-error">' + escapeHtml(cs.error) + '</div>';

    html += '</div><div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Close</button></div>';

  function estimateNutrition() {
    var ids = cookRecipeIds();
    var targets = ids.filter(function (id) { return !nutritionOf(recipes[id]); });
    if (!targets.length) targets = ids;
    targets = targets.slice(0, 12);
    if (!targets.length || !sampleApi) return;
    var token = {};
    modalState.nut = { loading: true, error: '', token: token };
    renderModal();
    var lines = targets.map(function (id) {
      var r = recipes[id];
      return 'id: ' + id + ' | ' + r.name + ' | serves ' + (r.baseServings || 1) + ' | ' + (r.ingredients || []).filter(function (i) { return i && i.name; }).map(function (i) {
        return ((parseFloat(i.amount) || 0) > 0 ? i.amount + ' ' + (i.unit || '') + ' ' : (i.unit ? i.unit + ' ' : '')) + i.name;
      }).join('; ');
    });
    var prompt = 'Estimate the nutrition PER SERVING for each recipe below, from its ingredients and how many it serves. Use typical values and be realistic.\n' +
      'Reply with JSON exactly like {"recipes": [{"id": string, "calories": number, "protein": number, "carbs": number, "fat": number}]} — protein, carbs and fat in grams. Return ONLY the JSON.\n\n' + lines.join('\n');

        saveRecipeRecord(x.id, copy);
        got++;
      });
      modalState.nut = { loading: false, error: got ? '' : 'No estimates came back — try again.' };
      if (modalState.mode === 'nutrition') renderModal();
    }).catch(function (err) {

      modalState.nut = { loading: false, error: sampleErrorMessage(err) };
      renderModal();

  }

  function estimateCost() {
    var items = costItems().slice(0, 80);
    if (!items.length || !sampleApi) return;
    var token = {};
    modalState.cost = { loading: true, error: '', token: token };
    renderModal();
    var prompt = 'Estimate what each grocery item below costs at a typical supermarket in region "' + viewerRegion + '", in ' + viewerCurrency + '. ' +
      'Price each line as it would actually be bought (whole packages, e.g. a whole bag of flour even if only 2 cups are needed). ' +
      'Reply with JSON exactly like {"items": [{"n": number, "price": number}]}, where n is the line number. Return ONLY the JSON.\n\n' +
      items.map(function (ci, i) { return (i + 1) + '. ' + ci.label; }).join('\n');

      var got = 0;

  // Shrinks a picked photo on a canvas, so a 12-megapixel phone shot becomes a quick-loading JPEG.
  function shrinkPhoto(file, maxSide) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error('unreadable')); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('unreadable')); };
        img.onload = function () {
          var scale = Math.min(1, maxSide / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * scale));
          c.height = Math.max(1, Math.round(img.naturalHeight * scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c);
        };
        img.src = String(reader.result);
      };
      reader.readAsDataURL(file);
    });
  }

  function handlePhotoFile(file) {
    if (!file) return;
    if (!/^image\//.test(file.type || 'image/')) { setPhotoStatus('That file isn’t a photo.', true); return; }
    var token = {};
    modalState.photoToken = token;
    setPhotoStatus('Adding photo…');
    var pick = document.getElementById('rfPhotoPick');
    if (pick) pick.disabled = true;
    var finish = function (err) {
      if (modalState.photoToken !== token) return;
      var p2 = document.getElementById('rfPhotoPick');
      if (p2) p2.disabled = false;
      setPhotoStatus(err || '', !!err);
      syncPhotoField();
    };
    if (mode === 'db' && assetsApi) {
      shrinkPhoto(file, 1280).then(function (canvas) {
        return new Promise(function (res, rej) { canvas.toBlob(function (b) { b ? res(b) : rej(new Error('encode')); }, 'image/jpeg', 0.84); });
      }).then(function (blob) {
        return assetsApi.upload(blob, { type: 'image/jpeg' });
      }).then(function (result) {
        if (modalState.photoToken !== token) { releasePhoto(result.id, 0); return; }
        (modalState.uploaded || (modalState.uploaded = [])).push(result.id);
        modalState.photo = result.id;
        finish('');
      }).catch(function (err) {
        var code = err && err.code;
        finish(code === 'too_large' ? 'That photo is too large.' : code === 'quota_or_state' ? 'Photo storage is full — remove some photos first.' : code === 'rate_limited' ? 'Too many uploads — wait a moment and try again.' : err && err.message === 'unreadable' ? 'Couldn’t read that photo — try a JPEG or PNG.' : 'Couldn’t add the photo — try again.');
      });
    } else {
      shrinkPhoto(file, 480).then(function (canvas) {
        modalState.photo = canvas.toDataURL('image/jpeg', 0.72);
        finish('');
      }).catch(function () { finish('Couldn’t read that photo — try a JPEG or PNG.'); });
    }
  }

  // Deletes an uploaded photo once nothing uses it (after any Undo window has passed).
  function releasePhoto(ref, delayMs) {

    setTimeout(function () {
      if (!assetsApi) return;
      var used = Object.keys(recipes).some(function (id) { return recipes[id] && recipes[id].photo === ref; });
      if (!used) assetsApi.delete(ref).catch(function () {});
    }, delayMs || 0);
  }

  // Only ever store a real web link (never e.g. a javascript: URL that would run when clicked).
  function cleanSourceUrl(raw) {
    var t = String(raw || '').trim();

    try {
      var u = new URL(t);

    } catch (e) { return null; }
  }

  function readRecipeForm() {
    var name = document.getElementById('rfName').value.trim();
    var baseServings = Math.max(1, parseInt(document.getElementById('rfServings').value, 10) || 1);
    var rows = Array.prototype.slice.call(document.getElementById('rfIngredients').querySelectorAll('.ingredient-row'));
    var ingredients = rows.map(function (row) {
      return {
        amount: parseFloat(row.querySelector('.ing-amount').value) || 0,
        unit: row.querySelector('.ing-unit').value.trim(),
        name: row.querySelector('.ing-name').value.trim()
      };
    }).filter(function (ing) { return ing.name; });
    var instructions = document.getElementById('rfInstructions').value.split('\n').map(function (t) { return t.trim(); }).filter(function (t) { return t; });
    var notes = document.getElementById('rfNotes').value.trim();
    var tags = Array.prototype.map.call(document.querySelectorAll('#rfTags .tag-option[aria-pressed="true"]'), function (b) { return b.getAttribute('data-tag'); });
    tags = cleanTags(tags.concat(document.getElementById('rfTagNew').value.split(',')));
    var prepMin = minutesOf(document.getElementById('rfPrep').value);
    var cookMin = minutesOf(document.getElementById('rfCook').value);
    var rating = ratingOf({ rating: document.getElementById('rfRating').getAttribute('data-value') });
    var sourceUrl = cleanSourceUrl(document.getElementById('rfSource').value);

    if (!name) return { error: 'Give the recipe a name.' };
    if (!ingredients.length) return { error: 'Add at least one ingredient.' };
    if (sourceUrl === null) return { error: 'That source link doesn’t look right — check it, or leave it empty.' };

    var existing = modalState.editId && recipes[modalState.editId];
    return { data: {
      name: name,
      baseServings: baseServings,
      ingredients: ingredients,
      instructions: instructions,
      notes: notes,
      sourceUrl: sourceUrl,
      favorite: !!(existing && existing.favorite),
      tags: tags,
      prepMin: prepMin,
      cookMin: cookMin,
      rating: rating,
      lastCooked: existing ? lastCookedOf(existing) : 0,
      photo: cleanPhotoRef(modalState.photo),
      nutrition: existing ? cleanNutrition(existing.nutrition) : null
    } };
  }

    if (before && JSON.stringify(before.instructions || []) !== JSON.stringify(res.data.instructions)) {
      delete cookDone[id];
      persistCookDone();
    }
    var oldPhoto = before && before.photo;
    saveRecipeRecord(id, res.data);
    if (oldPhoto && oldPhoto !== res.data.photo) releasePhoto(oldPhoto, 0);
    closeModal();
