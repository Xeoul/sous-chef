    copy.name = copy.name + ' (copy)';
    copy.favorite = false;
    copy.lastCooked = 0;
    var id = newId();
    saveRecipeRecord(id, copy);
    openModal('manual', { origin: 'edit', editId: id, prefill: copy });
    var nameInput = document.getElementById('rfName');
    nameInput.focus();
    nameInput.select();
    showToast('Duplicated — you’re now editing the copy');
  }

  // Turns whatever was pasted into a recipe link, if it is one: a full URL, a URL missing its
  // https://, or a phone share-sheet paste like "Best pad thai https://…" (title plus link).
  function linkFromText(text) {
    var t = String(text || '').trim();
    if (!t) return null;
    if (/^https?:\/\/\S+$/i.test(t)) return t;
    if (!/\s/.test(t) && /^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)+\/\S*$/i.test(t)) return 'https://' + t;
    var found = t.match(/https?:\/\/\S+/gi);
    if (found && found.length === 1 && t.length < 300 && t.split('\n').length <= 3) return found[0].replace(/[).,]+$/, '');
    return null;
  }

  function mcpErrorMessage(err, context) {
    var code = err && err.code;
    var isSearch = context === 'search';
    if (code === 'needs_reauth') return 'Parallel Search needs to be reconnected — check claude.ai Settings → Connectors.';
    if (code === 'server_not_connected') return 'Parallel Search isn’t connected — add it in claude.ai Settings → Connectors.';
    if (code === 'selection_required') return 'Choose a Parallel Search connection in claude.ai, then try again.';
    if (/rate.?limit|too many requests/i.test((err && err.message) || '')) {
      return isSearch ? 'Recipe search is busy right now — wait a minute and try again, or paste a link.' : 'Link reading is busy right now — wait a minute and try again, or paste the ingredient text.';
    }
    if (code === 'tool_error') return (err && err.message) || (isSearch ? 'That search didn’t go through — try again or paste a link instead.' : 'That link couldn’t be fetched — try pasting the ingredient text instead.');
    if (code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') {
      return isSearch ? 'Recipe search isn’t available in this view — paste a link or the ingredient text instead.' : 'Link fetching isn’t available in this view — paste the ingredient text instead.';
    }
    return isSearch ? 'Couldn’t search right now — try again or paste a link instead.' : 'Couldn’t fetch that link — try pasting the ingredient text instead.';
  }

  function sampleErrorMessage(err) {
    if (err && err.code === 'not_granted') return 'AI parsing needs your permission — try again and allow it when prompted.';
    if (err && err.code === 'rate_limited') return 'Too many requests right now — wait a moment and try again.';
    return 'Something went wrong reading that — try again or enter it manually.';
  }

  // Asks Parallel Search for the page. Some recipe sites refuse live fetches (paywalls, bot
  // walls), so a failed live read is retried once from Parallel's cached copy of the page.
  function fetchPage(url, live) {
    var input = {
      urls: [url],
      objective: 'Recipe title, servings or yield, the full ingredient list with quantities and units, and every step of the directions',
      search_queries: ['recipe ingredients list', 'recipe directions steps'],
      session_id: mcpSessionId
    };
    if (!live) input.allow_live_fetch = false;
    return mcpApi.callTool('Parallel Search', 'web_fetch', input).then(function (result) {
      var payload = result && result.payload;
      var pageResult = payload && Array.isArray(payload.results) ? payload.results[0] : null;
      var text = pageResult ? ((pageResult.excerpts && pageResult.excerpts.length ? pageResult.excerpts.join('\n\n') : '') || pageResult.full_content || '') : '';
      var apiErr = payload && Array.isArray(payload.errors) ? payload.errors[0] : null;
      return { page: pageResult, text: text, error: apiErr };
    });
  }

  function fetchErrorMessage(apiErr) {
    var status = apiErr && apiErr.http_status_code;
    if (status === 401 || status === 402 || status === 403 || status === 429) {
      return 'That site doesn’t let pages be read automatically. Open the recipe, copy the ingredients and steps, and paste them here instead.';
    }
    if (status === 404) return 'That page wasn’t found — check the link, or paste the ingredient text instead.';
    return (apiErr && typeof apiErr.message === 'string' && apiErr.message) || 'Couldn’t read that page — try pasting the ingredient text instead.';
  }

  function fetchAndParseUrl(url) {
    if (!mcpApi) {
      modalState.parseError = 'Link fetching isn’t available right now — paste the ingredient text instead.';
      renderModal();
      return;
    }
    modalState.parsing = true;
    modalState.parsingLabel = 'Reading the page…';
    modalState.parseError = '';
    modalState.importUrl = url;
    renderModal();

    fetchPage(url, true).then(function (res) {
      if (res.text) return res;
      modalState.parsingLabel = 'Trying a saved copy of the page…';
      renderModal();
      return fetchPage(url, false).then(function (cached) { return cached.text ? cached : res; }, function () { return res; });
    }).then(function (res) {
      if (modalState.importUrl !== url) return; // the viewer moved on to another link
      if (!res.text) {
        modalState.parsing = false;
        modalState.parseError = res.page ? 'That page didn’t return any readable content — try pasting the ingredient text instead.' : fetchErrorMessage(res.error);
        renderModal();
        return;
      }
      var text = res.page.title ? 'PAGE TITLE: ' + res.page.title + '\n\n' + res.text : res.text;
      runAiParse(text);
    }).catch(function (err) {
      modalState.parsing = false;
      modalState.parseError = mcpErrorMessage(err);
      renderModal();
    });
  }

  function doSearch() {
    var input = document.getElementById('searchQuery');
    var query = input.value.trim();
    modalState.searchQuery = query;
    if (!query) return;

    // A link pasted into the search box goes straight to import rather than a web search.
    var link = linkFromText(query);
    if (link) {
      modalState.pasteText = link;
      fetchAndParseUrl(link);
      return;
    }

    if (!mcpApi) {
      modalState.searchError = 'Recipe search isn’t available right now — paste a link or the ingredient text below instead.';
      renderModal();
      return;
    }
    modalState.searching = true;
    modalState.searchError = '';
    modalState.searchResults = null;
    renderModal();

    mcpApi.callTool('Parallel Search', 'web_search', {
      objective: 'Find a well-reviewed recipe with a full ingredient list and instructions for: ' + query,
      search_queries: [query + ' recipe'],
      session_id: mcpSessionId
    }).then(function (result) {
      modalState.searching = false;
      var payload = result && result.payload;
      var results = payload && Array.isArray(payload.results) ? payload.results : [];
      modalState.searchResults = results.filter(function (r) { return r && r.url; }).slice(0, 6);
      renderModal();
    }).catch(function (err) {
      modalState.searching = false;
      modalState.searchError = mcpErrorMessage(err, 'search');
      renderModal();
    });
  }

  function pickSearchResult(index) {
    var r = modalState.searchResults && modalState.searchResults[index];
    if (!r || !r.url) return;
    modalState.pasteText = r.url;
    fetchAndParseUrl(r.url);
  }

  function doParse() {
    var raw = document.getElementById('pasteText').value;
    modalState.pasteText = raw;
    var trimmed = raw.trim();
    if (!trimmed) return;

    var link = linkFromText(trimmed);
    if (link) {
      fetchAndParseUrl(link);
      return;
    }
    modalState.importUrl = null;

    if (!sampleApi) {
      modalState.parseError = 'AI parsing isn’t available right now — try Type it in instead.';
      renderModal();
      return;
    }
    modalState.parsing = true;
    modalState.parsingLabel = 'Sorting ingredients…';
    modalState.parseError = '';
    renderModal();
    runAiParse(trimmed);
  }

  var RECIPE_JSON_SHAPE = '{"name": string, "baseServings": number, "prepMinutes": number, "cookMinutes": number, "ingredients": [{"amount": number, "unit": string, "name": string}], "instructions": [string]}';

  // Checks and trims whatever the AI sent back into a recipe the form can show; null if unusable.
  function prefillFromAi(result) {
    if (!result || !Array.isArray(result.ingredients)) return null;
    var prefill = {
      name: (result.name || '').toString().slice(0, 120) || 'New recipe',
      baseServings: Math.max(1, Math.min(50, parseInt(result.baseServings, 10) || 4)),
      prepMin: minutesOf(result.prepMinutes),
      cookMin: minutesOf(result.cookMinutes),
      ingredients: result.ingredients.slice(0, 60).map(function (i) {
        i = i || {};
        return { amount: parseFloat(i.amount) || 0, unit: (i.unit || '').toString().slice(0, 24), name: (i.name || '').toString().slice(0, 80) };
      }).filter(function (i) { return i.name; }),
      instructions: Array.isArray(result.instructions) ? result.instructions.slice(0, 40).map(function (s) {
        return String(s == null ? '' : s).trim().slice(0, 300);
      }).filter(Boolean) : []
    };
    return prefill.ingredients.length ? prefill : null;
  }

  function runAiParse(text) {
    if (!sampleApi) {
      modalState.parsing = false;
      modalState.parseError = 'AI parsing isn’t available right now — try Type it in instead.';
      renderModal();
      return;
    }
    modalState.parsingLabel = 'Sorting ingredients…';
    renderModal();

    var prompt = 'Extract a cooking recipe from the following text into JSON with this exact shape: ' +
      RECIPE_JSON_SHAPE + '. ' +
      'Use the servings or yield stated in the text if present, otherwise default to 4. Use the prep and cook times stated in the text, in minutes, or 0 if not stated. ' +
      'Split each ingredient line into a numeric amount, a short unit (e.g. g, kg, oz, lb, ml, l, tsp, tbsp, cup, clove, bunch, can, pinch, each — use "each" or an empty string for count-only items), ' +
      'and the ingredient name without quantity words. If an ingredient has no clear numeric amount, use amount 0 and put descriptive text like "to taste" in the unit field. ' +
      'For "instructions", give each distinct cooking step as one string in order (split a numbered or paragraph list of steps into separate array entries; omit the step numbers themselves). ' +
      'Only include actual recipe ingredients and steps — ignore ads or unrelated text. Return ONLY the JSON object, no other text.\n\nTEXT:\n' + text;

    sampleApi.json(prompt).then(function (result) {
      modalState.parsing = false;
      var prefill = prefillFromAi(result);
      if (prefill) prefill.sourceUrl = modalState.importUrl ? (cleanSourceUrl(modalState.importUrl) || '') : '';
      if (!prefill) {
        modalState.parseError = 'Couldn’t find any ingredients there — try pasting just the ingredient list.';
        renderModal();
        return;
      }
      openModal('manual', { origin: 'new', editId: null, prefill: prefill });
    }).catch(function (err) {
      modalState.parsing = false;
      modalState.parseError = sampleErrorMessage(err);
      renderModal();
    });
  }

  modalBodyEl.addEventListener('click', function (e) {
    var action = e.target.closest('[data-action]');
    if (action) {
      switch (action.getAttribute('data-action')) {
        case 'choose-manual': openModal('manual', { origin: 'new', editId: null, prefill: null }); break;
        case 'choose-paste': openModal('paste', { origin: 'new' }); break;
        case 'back-choice': openModal('choice', { origin: 'new', editId: null, prefill: null }); break;
        case 'close-modal': closeModal(); break;
        case 'add-ingredient':
          document.getElementById('rfIngredients').insertAdjacentHTML('beforeend', ingredientRowHtml());
          break;
        case 'do-parse':
          doParse();
          break;
        case 'do-search':
          doSearch();
          break;
        case 'pick-result':
          pickSearchResult(parseInt(action.getAttribute('data-index'), 10));
          break;
        case 'save-recipe': saveFromModalForm(); break;
        case 'find-ideas': findIdeas(); break;
        case 'create-idea': createFromIdea(parseInt(action.getAttribute('data-index'), 10)); break;
        case 'plan-idea': planIdea(action.getAttribute('data-id')); break;
        case 'add-swap':
          var swapPick = modalState.swap && modalState.swap.list[parseInt(action.getAttribute('data-index'), 10)];
          if (swapPick) {
            addExtras(swapPick.name);
            showToast('Added ' + swapPick.name + ' to your shopping list');
            action.disabled = true;
            action.textContent = 'Added';
          }
          break;
        case 'duplicate': duplicateFromModalForm(); break;
        case 'estimate-nutrition': estimateNutrition(); break;
        case 'estimate-cost': estimateCost(); break;
        case 'pick-photo': document.getElementById('rfPhotoFile').click(); break;
        case 'remove-photo':
          modalState.photo = '';
          modalState.photoToken = {};
          setPhotoStatus('');
          syncPhotoField();
          break;
        case 'share-recipe':
          if (modalState.editId && recipes[modalState.editId]) openRecipeShare(modalState.editId);
          break;
        case 'native-share':
          if (navigator.share) navigator.share({ title: modalState.shareTitle || 'Recipe', text: modalState.shareText }).catch(function () {});
          break;
        case 'print-recipe': printRecipe(modalState.shareId); break;
        case 'save-recipe-file': saveRecipeFile(modalState.shareId); break;
        case 'copy-backup': copyBackup(); break;
        case 'save-backup': saveBackupFile(); break;
        case 'restore-file': document.getElementById('restoreFile').click(); break;
        case 'do-restore': doRestore(document.getElementById('restoreText').value); break;
        case 'copy-share':
          var ta = document.getElementById('shareText');
          ta.focus();
          ta.select();
          var copied = false;
          try { copied = document.execCommand('copy'); } catch (err) {}
          if (copied) { var copiedLabel = modalState.copiedLabel || 'Shopping list copied'; closeModal(); showToast(copiedLabel); }
          else action.textContent = 'Selected — press Copy on your keyboard';
          break;
        // Toggle the footer in place rather than re-rendering the form, so unsaved edits survive.
        case 'delete': action.closest('.form-actions').classList.add('confirming'); break;
        case 'cancel-delete': action.closest('.form-actions').classList.remove('confirming'); break;
        case 'confirm-delete':
          var delId = modalState.editId;
          closeModal();
          if (delId && recipes[delId]) {
            var deleted = JSON.parse(JSON.stringify(recipes[delId]));
            var plannedServings = week.items[delId];
            var plannedDay = week.days[delId], plannedLeftover = week.leftovers[delId];
            deleteRecipeRecord(delId);
            if (deleted.photo) releasePhoto(deleted.photo, 9000);
            showToast('Deleted “' + deleted.name + '”', function () {
              saveRecipeRecord(delId, deleted);
              if (plannedServings) {
                var w = cloneWeek(week);
                w.items[delId] = plannedServings;
                if (plannedDay !== undefined) w.days[delId] = plannedDay;
                if (plannedLeftover !== undefined) w.leftovers[delId] = plannedLeftover;
                saveWeekRecord(w);
              }
            });
          }
          break;
      }
      return;
    }
    var star = e.target.closest('.star-btn');
    if (star) {
      var val = parseInt(star.getAttribute('data-rating'), 10);
      var cur = parseInt(document.getElementById('rfRating').getAttribute('data-value'), 10) || 0;
      setFormRating(val === cur ? 0 : val); // tap the current rating again to clear it
      return;
    }
    var tagOpt = e.target.closest('.tag-option');
    if (tagOpt) {
      tagOpt.setAttribute('aria-pressed', tagOpt.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
      return;
    }
    var removeBtn = e.target.closest('.remove-ing');
    if (removeBtn) {
      var wrap = document.getElementById('rfIngredients');
      var rows = wrap.querySelectorAll('.ingredient-row');
      if (rows.length > 1) removeBtn.closest('.ingredient-row').remove();
      else removeBtn.closest('.ingredient-row').querySelectorAll('input').forEach(function (i) { i.value = ''; });
    }
  });

  modalBodyEl.addEventListener('input', function (e) {
    if (e.target.id === 'pasteText') modalState.pasteText = e.target.value;
    else if (e.target.id === 'haveText') modalState.haveText = e.target.value;
    else if (e.target.id === 'searchQuery') modalState.searchQuery = e.target.value;
  });

  modalBodyEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'searchQuery') {
      e.preventDefault();
      doSearch();
    }
    if ((e.key === 'Enter' || e.key === ',') && e.target.id === 'rfTagNew') {
      e.preventDefault();
      addTagOption(e.target.value);
    }
  });

  modalBackdrop.addEventListener('click', function (e) {
    if (e.target === modalBackdrop) closeModal();
  });
  modalCloseBtn.addEventListener('click', closeModal);
  document.addEventListener('keydown', function (e) {
    if (!modalBackdrop.hidden) { if (e.key === 'Escape') closeModal(); return; }
    if (!along) return;
    if (e.key === 'Escape') closeAlong();
    else if (e.key === 'ArrowRight' && !e.target.closest('input, textarea, select')) { e.preventDefault(); goAlong(1); }
    else if (e.key === 'ArrowLeft' && !e.target.closest('input, textarea, select')) { e.preventDefault(); goAlong(-1); }
  });

  newRecipeBtn.addEventListener('click', function () {
    openModal(sampleApi ? 'choice' : 'manual', { origin: 'new', editId: null, prefill: null });
  });

  // ---------- Event delegation (main page) ----------

  function playCheckPop(checkbox) {
    // A JS-driven, one-shot class rather than a stateless :checked selector — the latter
    // would replay every time the row became visible again after being [hidden] (e.g. a
    // tab switch), not just on the actual check action.
    if (!checkbox.checked) return;
    markTransient(checkbox, 'just-checked');
  }

  recipeListEl.addEventListener('change', function (e) {
    if (e.target.matches('input[type="checkbox"][data-recipe]')) {
      playCheckPop(e.target);
      toggleRecipeIncluded(e.target.getAttribute('data-recipe'), e.target.checked);
    } else if (e.target.matches('select[data-day-for]')) {
      setRecipeDay(e.target.getAttribute('data-day-for'), parseInt(e.target.value, 10));
    } else if (e.target.matches('select[data-leftover-for]')) {
      setLeftoverDay(e.target.getAttribute('data-leftover-for'), parseInt(e.target.value, 10));
    }
  });

  weekStripEl.addEventListener('click', function (e) {
    var cell = e.target.closest('[data-day]');
    if (cell) openDayInCook(parseInt(cell.getAttribute('data-day'), 10));
  });

  recipeListEl.addEventListener('click', function (e) {
    var stepper = e.target.closest('.stepper');
    if (stepper) {
      adjustItemServings(stepper.getAttribute('data-recipe'), parseInt(stepper.getAttribute('data-delta'), 10));
      return;
    }

    var favBtn = e.target.closest('[data-action="favorite"]');
    if (favBtn) {
      var favId = favBtn.getAttribute('data-id');
      toggleFavorite(favId);
      if (recipes[favId] && recipes[favId].favorite) markTransient(favBtn, 'bump');
      return;
    }
    var editBtn = e.target.closest('[data-action="edit"]');
    if (editBtn) {
      var id = editBtn.getAttribute('data-id');
      openModal('manual', { origin: 'edit', editId: id, prefill: recipes[id] });
    }
  });

  // "Go to Recipes" links in empty states.
  document.addEventListener('click', function (e) {
    var go = e.target.closest('[data-goto]');
    if (go) setActiveTab(go.getAttribute('data-goto'));
  });

  panelShopEl.addEventListener('change', function (e) {
    if (e.target.matches('input[type="checkbox"][data-key]')) {
      playCheckPop(e.target);
      toggleChecked(e.target.getAttribute('data-key'));
    }
  });
  panelShopEl.addEventListener('click', function (e) {
    var p = e.target.closest('[data-pantry]');
    if (p) { moveToPantry(p.getAttribute('data-pantry'), p.getAttribute('data-name')); return; }
    var rp = e.target.closest('[data-repeat-extra]');
    if (rp) { toggleEveryWeek(rp.getAttribute('data-repeat-extra')); return; }
    var x = e.target.closest('[data-remove-extra]');
    if (x) { removeExtra(x.getAttribute('data-remove-extra')); return; }
    var u = e.target.closest('[data-unpantry]');
    if (u) { takeFromPantry(u.getAttribute('data-unpantry')); return; }
    if (e.target.closest('#shareListBtn')) shareList();
  });
  addItemFormEl.addEventListener('submit', function (e) {
    e.preventDefault();
    if (addExtras(addItemInputEl.value)) addItemInputEl.value = '';
    addItemInputEl.focus();
  });
  clearCheckedBtn.addEventListener('click', clearChecked);
  newWeekBtn.addEventListener('click', startNewWeek);
  recipeSearchEl.addEventListener('input', function () {
    recipeQuery = recipeSearchEl.value;
    renderRecipes();
  });
  favFilterBtn.addEventListener('click', function () {
    favoritesOnly = !favoritesOnly;
    renderRecipes();
  });
  tagFiltersEl.addEventListener('click', function (e) {
    var chip = e.target.closest('[data-tag-filter]');
    if (!chip) return;
    var t = chip.getAttribute('data-tag-filter');
    tagFilter = tagFilter === t ? '' : t;
    renderRecipes();
  });

  // ---------- Init ----------

  function renderAll() {
    renderVisible();
  }

  renderUnitToggle();
  renderViewToggle();
  renderAll();
  setActiveTab(activeTab);

  function initLocalFallback() {
    mode = 'local';
    try { recipes = JSON.parse(localStorage.getItem('larder_recipes') || '{}'); } catch (e) { recipes = {}; }
    try { week = normalizeWeek(JSON.parse(localStorage.getItem('larder_week') || 'null')); } catch (e) { week = defaultWeek(); }
    setStatus('Saved on this device', true);
    renderAll();
  }

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(function (ns) { sampleApi = ns; if (ns) renderVisible(); }).catch(function () {});
    window.claude.use('mcp').then(function (ns) { mcpApi = ns; }).catch(function () {});
    window.claude.use('downloads').then(function (ns) { downloadsApi = ns; }).catch(function () {});
    window.claude.use('assets').then(function (ns) { assetsApi = ns; }).catch(function () {});

    window.claude.use('db').then(function (namespace) {
      if (!namespace) { initLocalFallback(); return; }
      db = namespace;
      mode = 'db';
      var gotRecipes = false, gotWeek = false;
      function checkReady() { if (gotRecipes && gotWeek) setStatus('Synced', false); }

      db.collection('recipes').onSnapshot(function (snap) {
        var incoming = {};
        snap.docs.forEach(function (d) { incoming[d.id] = d.data(); });
        gotRecipes = true;
        if (recipeWritesInFlight) { heldServerRecipes = incoming; checkReady(); return; }
        recipes = incoming;
        heldServerRecipes = null;
        renderVisible();
        checkReady();
      }, function () { setStatus('Sync error — reload to retry', true); });

      db.doc('mealplan/week').onSnapshot(function (snap) {
        var incoming = snap.exists ? normalizeWeek(snap.data()) : defaultWeek();
        gotWeek = true;
        latestServerWeek = incoming;
        // Older than what's on screen while our own changes are still on their way — see
        // weekHasUnsavedChanges. It's applied (if still different) once they settle.
        if (weekHasUnsavedChanges()) { checkReady(); return; }
        // A write we just made locally echoes back through this same snapshot listener —
        // skip the re-render when nothing actually changed, so it doesn't replay list animations.
        if (sameWeek(incoming, week)) { checkReady(); return; }
        week = incoming;
        renderVisible();
        checkReady();
      }, function () { setStatus('Sync error — reload to retry', true); });
    }).catch(function () { initLocalFallback(); });
  } else {
    initLocalFallback();
  }
})();
</script>
</body></html>
